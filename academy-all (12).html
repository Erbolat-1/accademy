function viewDashboard(){
  const my=DB.enrolled.map(getCourse).filter(Boolean);
  const avgP=my.length?Math.round(my.reduce((s,c)=>s+courseProgress(c),0)/my.length):0;
  const best=Object.values(DB.scores).map(s=>s.best);
  const passed=best.filter(b=>b>=PASS).length;
  const avgScore=best.length?Math.round(best.reduce((a,b)=>a+b,0)/best.length):null;
  const feed=my.flatMap(c=>(DB.posts[c.id]||[]).map(p=>({...p,c}))).sort((a,b)=>b.date-a.date).slice(0,6);
  const next=my.map(c=>({c,a:allActs(c).find(a=>!DB.done[a.id])})).filter(x=>x.a);

  return `
    <div class="head"><div>
      <div class="eyebrow">Личный кабинет</div>
      <h1>Привет, ${esc(DB.user.name)}!</h1>
      <p class="muted" style="margin:6px 0 0">Продолжайте обучение там, где остановились.</p>
    </div></div>
    <div class="grid g4">
      ${stat('Курсов',my.length)}
      ${stat('Средний прогресс',avgP+'%')}
      ${stat('Тестов зачтено',passed)}
      ${stat('Средний балл',avgScore===null?'—':avgScore+'%')}

    <div class="split" style="margin-top:22px">
      <section class="stack">
        <h2>Мои курсы</h2>
        ${my.length?`<div class="grid g3">${my.map(c=>courseCard(c)).join('')}</div>`
          :emptyBlock('Вы ещё не записаны ни на один курс','<a class="btn primary small" href="#/courses">Открыть каталог</a>')}
      </section>
      <aside class="stack">
        <div class="glass card stack"><h3>Следующие шаги</h3>
          ${next.length?next.slice(0,5).map(x=>`<a class="next" href="#/act/${x.a.id}">
            <span class="ico">${ICON[x.a.type]}</span>
            <span class="grow"><span class="at">${esc(x.a.title)}</span><span class="muted small">${esc(x.c.title)}</span></span></a>`).join('')
            :'<p class="muted small">Все материалы пройдены. Отличная работа!</p>'}
        </div>
        <div class="glass card stack"><h3>Объявления</h3>

            :'<p class="muted small">Пока нет объявлений.</p>'}

function viewCourse(id){
  const c=getCourse(id);
  if(!c) return notFound();
  const isT=DB.user.role==='teacher';
  const isIn=DB.enrolled.includes(c.id);
  const acts=allActs(c);
  const doneN=acts.filter(a=>DB.done[a.id]).length;
  const pr=courseProgress(c);

  const hero=`<div class="glass hero" style="--c:${c.color}">
    <div>
      <div class="eyebrow">Курс · ${esc(c.teacher)}</div>
      <h1 style="margin-top:6px">${esc(c.title)}</h1>
      <p class="muted">${esc(c.desc)}</p>
      ${isT?'':`<button class="btn small ${isIn?'ghost':'primary'}" data-act="enroll" data-id="${c.id}">${isIn?'Отписаться от курса':'Записаться на курс'}</button>`}
    </div>
    ${ring(pr,`${doneN} из ${acts.length}`)}
  </div>`;

  const sections=isIn||isT
    ?c.sections.map((s,si)=>`<details class="glass sec" ${si===0?'open':''}>
        <summary><span>${esc(s.title)}</span><span class="muted small">${s.acts.filter(a=>DB.done[a.id]).length}/${s.acts.length}</span></summary>
        <div class="acts">${s.acts.length?s.acts.map(a=>actRow(a)).join(''):'<p class="muted small" style="padding:8px">Материалов пока нет.</p>'}</div>
      </details>`).join('')
    :emptyBlock('Материалы закрыты','<p class="muted small">Запишитесь на курс, чтобы открыть задания и тесты.</p>');

  const material=isT?`<form class="glass card stack" data-form="material" data-id="${c.id}">
      <h3>Добавить материал</h3>
      <input name="title" required maxlength="80" placeholder="Название">
      <textarea name="body" required placeholder="Текст материала. Пустая строка — новый абзац."></textarea>
      <div><button class="btn primary small" type="submit">Опубликовать</button></div>
    </form>`:'';

  return `${hero}
    <div class="split">
      <section class="stack">${sections}</section>
      <aside class="stack">${material}${viewForum(c)}</aside>
    </div>`;
}

function pickQuestions(a){
  if(!a.pool) return a.questions;
  const arr=a.pool.slice();
  for(let k=arr.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[arr[k],arr[r]]=[arr[r],arr[k]];}
  return arr.slice(0,a.draw||arr.length);
}

function quizResult(a,st){
  const qs=st.qs||a.questions;
  const correct=qs.reduce((n,q,i)=>n+(st.answers[i]===q.a?1:0),0);
  const pct=Math.round(correct/qs.length*100);
  const ok=pct>=PASS;
  return `<div class="glass card stack">
    <div class="row"><span class="tag ${ok?'ok':'bad'}">${ok?'Зачтено':'Не зачтено'}</span>
      <h2>${pct}%</h2>
      <span class="muted">${correct} из ${qs.length} верно · порог ${PASS}%</span></div>
    ${qs.map((q,i)=>`<div class="qblock"><div class="qt">${i+1}. ${esc(q.q)}</div>
      ${q.o.map((o,j)=>`<div class="opt ${j===q.a?'right':(st.answers[i]===j?'wrong':'')}"><span class="k">${'ABCDEF'[j]}</span><span>${esc(o)}</span></div>`).join('')}
    </div>`).join('')}
    <div class="row"><button class="btn primary small" data-act="retake" data-id="${a.id}">Пройти ещё раз</button></div>
  </div>`;
}

function viewQuiz(a){
  let st=mem.quiz[a.id];
  if(st&&st.submitted) return quizResult(a,st);
  if(!st||!st.qs){ st={answers:{},submitted:false,qs:pickQuestions(a)}; mem.quiz[a.id]=st; }
  const qs=st.qs;
  const sc=DB.scores[a.id];
  const info=sc?`<p class="muted small">Лучший результат: <b>${sc.best}%</b> · попыток: ${sc.tries}</p>`:'';
  const note=a.pool?`<p class="muted small">Вариант из ${qs.length} случайных вопросов банка (всего ${a.pool.length}).</p>`:'';
  return `${info}${note}<form class="glass card stack" data-form="quiz" data-id="${a.id}">
    ${qs.map((q,i)=>`<div class="qblock"><div class="qt">${i+1}. ${esc(q.q)}</div>
      ${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" ${st.answers[i]===j?'checked':''}><span class="k">${'ABCDEF'[j]}</span><span>${esc(o)}</span></label>`).join('')}
    </div>`).join('')}
    <div><button class="btn primary" type="submit">Отправить ответы</button></div>
  </form>`;
}

function viewAssign(a){
  const sub=DB.subs[a.id];
  return `<article class="glass card prose"><p>${esc(a.desc)}</p></article>
    <form class="glass card stack" data-form="assign" data-id="${a.id}" style="margin-top:16px">
      <h3>Ваш ответ</h3>
      <textarea name="text" required maxlength="2000" placeholder="Введите текст работы" style="min-height:140px">${esc(sub?sub.text:'')}</textarea>
      <div class="row">
        <button class="btn primary small" type="submit">${sub?'Обновить работу':'Сдать работу'}</button>
        ${sub?`<span class="tag ok">сдано ${fmtDate(sub.date)}</span>`:''}
      </div>
      <p class="muted small">Работа сохраняется в вашем браузере.</p>

}

function viewAct(id){
  const f=findAct(id);
  if(!f) return notFound();
  const {c,a}=f;
  const canSee=DB.enrolled.includes(c.id)||DB.user.role==='teacher';
  if(!canSee) return emptyBlock('Нет доступа',`<p class="muted small">Запишитесь на курс «${esc(c.title)}».</p><a class="btn ghost small" href="#/course/${c.id}">К курсу</a>`);

  const crumb=`<div class="crumb"><a href="#/course/${c.id}">← ${esc(c.title)}</a></div>`;
  let body='';
  if(a.type==='page'||a.type==='frame'){
    const d=!!DB.done[a.id];
    const inner=a.type==='frame'
      ?`<iframe class="frame" title="${esc(a.title)}" srcdoc="${esc(a.html)}"></iframe>`
      :`<article class="glass card prose">${paras(a.body)}</article>`;
    body=`${inner}
      <div class="row" style="margin-top:16px"><button class="btn ${d?'ghost':'primary'}" data-act="done" data-id="${a.id}">${d?'✓ Пройдено (отменить)':'Отметить как пройденное'}</button></div>`;
  } else if(a.type==='quiz'){
    body=viewQuiz(a);
  } else {
    body=viewAssign(a);
  }
  return `${crumb}<div class="eyebrow">${TYPE[a.type]}</div>
    <h1 style="margin:6px 0 20px">${esc(a.title)}</h1>${body}`;
}

function viewGrades(){
  const rows=[];
  DB.enrolled.map(getCourse).filter(Boolean).forEach(c=>allActs(c).forEach(a=>{
    if(a.type==='quiz'){
      const s=DB.scores[a.id];
      rows.push({c,a,val:s?s.best+'%':'—',label:s?(s.best>=PASS?'зачтено':'не зачтено'):'не пройден',cls:s?(s.best>=PASS?'ok':'bad'):'',date:s?s.date:null});
    } else if(a.type==='assign'){
      const s=DB.subs[a.id];
      rows.push({c,a,val:'—',label:s?'сдано':'не сдано',cls:s?'ok':'',date:s?s.date:null});
    }
  }));
  const qs=rows.filter(r=>r.a.type==='quiz'&&DB.scores[r.a.id]).map(r=>DB.scores[r.a.id].best);
  const avg=qs.length?Math.round(qs.reduce((a,b)=>a+b,0)/qs.length)+'%':'—';
  return `<div class="head"><div>
      <div class="eyebrow">Успеваемость</div>
      <h1>Оценки</h1>
    </div></div>
    <div class="grid g4" style="margin-bottom:22px">
      ${stat('Записано курсов',DB.enrolled.length)}
      ${stat('Средний балл за тесты',avg)}
      ${stat('Тестов зачтено',qs.filter(b=>b>=PASS).length)}
      ${stat('Заданий сдано',rows.filter(r=>r.a.type==='assign'&&DB.subs[r.a.id]).length)}
    </div>
    <div class="glass card tbl-wrap">
      ${rows.length?`<table>
        <thead><tr><th>Курс</th><th>Активность</th><th>Результат</th><th>Статус</th><th>Дата</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${esc(r.c.title)}</td>
          <td><a href="#/act/${r.a.id}" style="color:inherit;text-decoration:none">${ICON[r.a.type]} ${esc(r.a.title)}</a></td>

          <td><span class="tag ${r.cls}">${r.label}</span></td>
          <td class="muted small">${r.date?fmtDate(r.date):'—'}</td>
        </tr>`).join('')}</tbody>
      </table>`:'<p class="muted">Записывайтесь на курсы, чтобы видеть здесь свои оценки.</p>'}
    </div>`;
}

      <input name="name" required maxlength="40" placeholder="Имя и фамилия" aria-label="Имя">
      <input name="password" type="password" required minlength="6" placeholder="Пароль: от 6 знаков" autocomplete="new-password" aria-label="Пароль">
      <select name="role" aria-label="Роль"><option value="user">Пользователь</option><option value="admin">Администратор</option></select>
      <div><button class="btn primary small" type="submit">Создать</button></div>
    </form>`;

  const courses=allCourses().map(c=>`
    <details class="glass card course-edit">
      <summary><span><b>${esc(c.title)}</b> <span class="muted small">· ${esc(c.teacher)}</span></span><span class="muted small">${allActs(c).length} материалов</span></summary>
      <form class="stack" data-form="course_save" data-id="${c.id}" style="margin-top:14px">
        <input name="title" required maxlength="80" value="${esc(c.title)}" aria-label="Название курса">
        <input name="teacher" maxlength="60" value="${esc(c.teacher)}" aria-label="Преподаватель">
        <input name="desc" maxlength="200" value="${esc(c.desc)}" aria-label="Описание">
        <select name="color" aria-label="Цвет курса">${PALETTE.map(col=>`<option value="${col}" ${col===c.color?'selected':''}>${col}</option>`).join('')}</select>
        <div class="arow"><button class="btn primary small" type="submit">Сохранить курс</button>
          <button class="btn danger small" type="button" data-act="course_del" data-id="${c.id}">Удалить курс</button></div>
      </form>
      <div class="stack acts-edit">${allActs(c).map(a=>`
        <form class="act-edit" data-form="act_save" data-id="${a.id}">
          <span class="muted small">${ICON[a.type]||''} ${TYPE[a.type]||''}</span>
          <input name="title" required maxlength="120" value="${esc(a.title)}" aria-label="Название материала">
          ${a.type==='page'?`<textarea name="body" aria-label="Текст материала">${esc(a.body||'')}</textarea>`:''}
          <div class="arow"><button class="btn ghost small" type="submit">Сохранить</button>
            <button class="btn danger small" type="button" data-act="act_del" data-id="${a.id}">Удалить</button></div>
        </form>`).join('')||'<p class="muted small">Материалов нет.</p>'}</div>
    </details>`).join('');

  return `<div class="head"><div>
      <div class="eyebrow">Администрирование</div>
      <h1>Панель администратора</h1>
      <p class="muted" style="margin:6px 0 0">Учётные записи, логины и пароли, курсы и материалы.</p>
    </div></div>
    <div class="admin-cols">
      <section class="stack"><h2>Учётные записи (${DB.users.length})</h2>${rows}</section>
      <aside class="stack">${createForm}</aside>
    </div>
    <h2 style="margin:30px 0 12px">Курсы и материалы</h2>
    ${courses}`;
}

const ACTIONS={
  logout(){ setSession(null); DB.user=null; save(); location.hash='#/'; render(); },
  fill(d){
    const f=document.querySelector('form[data-form="auth"]');
    if(!f) return;
    f.querySelector('[name=login]').value=d.login;
    f.querySelector('[name=password]').value=d.pass;
  },
  user_del(d){
    const acc=DB.users.find(u=>u.id===d.id);
    if(!acc) return;
    if(acc.id===DB.user.id){ toast('Нельзя удалить свою учётную запись'); return; }
    if(acc.role==='admin'&&DB.users.filter(u=>u.role==='admin').length<2){ toast('Нельзя удалить последнего администратора'); return; }
    if(!confirm(`Удалить учётную запись «${acc.login}»?`)) return;
    DB.users=DB.users.filter(u=>u!==acc);
    save(); toast('Учётная запись удалена'); render();
  },
  course_del(d){
    const c=getCourse(d.id);
    if(!c) return;
    if(!confirm(`Удалить курс «${c.title}» у всех пользователей?`)) return;
    DB.removed=[...(DB.removed||[]),d.id];
    DB.enrolled=DB.enrolled.filter(x=>x!==d.id);
    save(); toast('Курс удалён'); render();
  },
  act_del(d){
    if(!confirm('Удалить этот материал из курса?')) return;
    DB.removedActs=DB.removedActs||{};
    DB.removedActs[d.id]=true;
    save(); toast('Материал удалён'); render();
  },
  enroll(d){
    const id=d.id;
    DB.enrolled=DB.enrolled.includes(id)?DB.enrolled.filter(x=>x!==id):[...DB.enrolled,id];
    save();
    toast(DB.enrolled.includes(id)?'Вы записаны на курс':'Вы отписались от курса');
    render();
  },
  done(d){ DB.done[d.id]=!DB.done[d.id]; save(); render(); },
  retake(d){ mem.quiz[d.id]={answers:{},submitted:false}; render(); },
  reset(){
    if(!confirm('Удалить весь прогресс, оценки и сообщения?')) return;
    const keep=['users','meta','removed','actEdits','removedActs','custom','added'];
    const fresh=defaultDB(); keep.forEach(k=>{fresh[k]=DB[k];}); fresh.user=DB.user;
    DB=fresh; save();
    toast('Данные сброшены');
    render();
  }
};

const FORMS={
  login(f){
    const fd=new FormData(f);
    const name=String(fd.get('name')||'').trim();
    if(!name) return;
    DB.user={name,role:fd.get('role')==='teacher'?'teacher':'student'};
    save();
    location.hash='#/dashboard';
    render();
  },
  profile(f){
    const n=String(new FormData(f).get('name')||'').trim();
    if(!n) return;
    DB.user.name=n; { const acc=DB.users.find(u=>u.id===DB.user.id); if(acc) acc.name=n; } save();
    toast('Имя сохранено');
    render();
  },
  auth(f){
    const fd=new FormData(f);
    const login=String(fd.get('login')||'').trim().toLowerCase();
    const pass=String(fd.get('password')||'');
    const acc=DB.users.find(u=>u.login===login);
    if(!acc||hashPw(pass,acc.salt)!==acc.hash){
      const err=document.getElementById('authErr');
      if(err) err.textContent='Неверный логин или пароль.';
      const fm=f; fm.classList.remove('shake'); void fm.offsetWidth; fm.classList.add('shake');
      return;
    }
    DB.user=accountToUser(acc);
    setSession(acc.id);
    save();
    location.hash='#/dashboard';
    render();
  },
  user_create(f){
    const fd=new FormData(f);
    const login=String(fd.get('login')||'').trim().toLowerCase();
    const name=String(fd.get('name')||'').trim();
    const pw=String(fd.get('password')||'');
    if(!/^[a-z0-9._-]{3,30}$/.test(login)){ toast('Логин: латиница, цифры, точка, дефис или подчёркивание, 3–30 знаков'); return; }
    if(!name) return;
    if(pw.length<6){ toast('Пароль не короче 6 знаков'); return; }
    if(DB.users.some(u=>u.login===login)){ toast('Такой логин уже занят'); return; }
    const salt=uid();
    DB.users.push({id:'u'+uid(),login,name,role:fd.get('role')==='admin'?'admin':'user',salt,hash:hashPw(pw,salt)});
    save(); toast('Учётная запись создана'); render();
  },
  user_save(f){
    const id=f.dataset.id, fd=new FormData(f);
    const acc=DB.users.find(u=>u.id===id);
    const name=String(fd.get('name')||'').trim();
    const role=fd.get('role')==='admin'?'admin':'user';
    if(!acc||!name) return;
    if(acc.role==='admin'&&role!=='admin'&&DB.users.filter(u=>u.role==='admin').length<2){ toast('Должен остаться хотя бы один администратор'); return; }
    acc.name=name; acc.role=role;
    if(DB.user&&DB.user.id===id) DB.user=accountToUser(acc);
    save(); toast('Сохранено'); render();
  },
  user_pass(f){
    const pw=String(new FormData(f).get('password')||'');
    const acc=DB.users.find(u=>u.id===f.dataset.id);
    if(!acc) return;
    if(pw.length<6){ toast('Пароль не короче 6 знаков'); return; }
    acc.salt=uid(); acc.hash=hashPw(pw,acc.salt);
    save(); toast('Пароль изменён'); f.reset();
  },
  course_save(f){
    const id=f.dataset.id, fd=new FormData(f);
    const title=String(fd.get('title')||'').trim();
    if(!title) return;
    (DB.meta||={})[id]={
      title,
      teacher:String(fd.get('teacher')||'').trim()||'Преподаватель',
      desc:String(fd.get('desc')||'').trim()||'Курс без описания',
      color:String(fd.get('color')||PALETTE[0])
    };
    save(); toast('Курс сохранён'); render();
  },
  act_save(f){
    const id=f.dataset.id, fd=new FormData(f);
    const title=String(fd.get('title')||'').trim();
    if(!title) return;
    DB.actEdits=DB.actEdits||{};
    DB.actEdits[id]={...(DB.actEdits[id]||{}),title,...(fd.has('body')?{body:String(fd.get('body')).trim()}:{})};
    save(); toast('Материал сохранён'); render();
  },
  newcourse(f){
    const fd=new FormData(f);
    const title=String(fd.get('title')||'').trim();
    if(!title) return;
    const c={
      id:'c'+uid(), title, teacher:DB.user.name,
      color:PALETTE[Math.floor(Math.random()*PALETTE.length)],
      desc:String(fd.get('desc')||'').trim()||'Курс без описания',
      sections:[{title:'Основной раздел',acts:[]}]
    };
    DB.custom.push(c);
    DB.enrolled.push(c.id);
    DB.posts[c.id]=[];
    save();
    toast('Курс создан');
    location.hash='#/course/'+c.id;
    render();
  },
  material(f){
    const fd=new FormData(f);
    const title=String(fd.get('title')||'').trim();
    const body=String(fd.get('body')||'').trim();
    if(!title||!body) return;
    const id=f.dataset.id;
    (DB.added[id]||=[]).push({id:'m'+uid(),type:'page',title,body});
    save();
    toast('Материал опубликован');
    render();
  },
  post(f){
    const text=String(new FormData(f).get('text')||'').trim();
    if(!text) return;
    const id=f.dataset.id;
    (DB.posts[id]||=[]).push({id:'p'+uid(),author:DB.user.name,role:DB.user.role,text,date:Date.now()});
    save();
    render();
  },
  assign(f){
    const text=String(new FormData(f).get('text')||'').trim();
    if(!text) return;
    const id=f.dataset.id;
    DB.subs[id]={text,date:Date.now()};
    DB.done[id]=true;
    save();
    toast('Работа сохранена');
    render();
  },
  quiz(f){
    const id=f.dataset.id;
    const f2=findAct(id);
    if(!f2) return;
    const a=f2.a;
    const qs=(mem.quiz[id]&&mem.quiz[id].qs)||a.questions;
    const fd=new FormData(f);
    const answers={};
    qs.forEach((q,i)=>{
      const v=fd.get('q'+i);
      answers[i]=v===null?-1:+v;
    });
    const correct=qs.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0);
    const pct=Math.round(correct/qs.length*100);
    mem.quiz[id]={answers,submitted:true,qs};
    const prev=DB.scores[id]||{best:0,tries:0};
    DB.scores[id]={best:Math.max(prev.best,pct),last:pct,tries:prev.tries+1,date:Date.now()};
    if(pct>=PASS) DB.done[id]=true;
    save();
    toast(pct>=PASS?'Тест зачтён':'Тест не зачтён, попробуйте ещё раз');
    render();
  }
};

/* ================= Роутинг и рендер ================= */
const app=$('#app');
function render(){
  if(!DB.user){ app.innerHTML=viewLogin(); return; }
  const parts=(location.hash||'#/dashboard').replace(/^#\/?/,'').split('/');
  const seg=parts[0]||'dashboard', id=parts[1];
  let view='dashboard', html;
  switch(seg){
    case 'courses': view='courses'; html=viewCourses(); break;
    case 'course':  view='courses'; html=viewCourse(id); break;
    case 'act':     view='courses'; html=viewAct(id); break;
    case 'grades':  view='grades';  html=viewGrades(); break;
    case 'profile': view='profile'; html=viewProfile(); break;
    case 'admin':
      if(DB.user.admin){ view='admin'; html=viewAdmin(); } else html=notFound();
      break;
    case 'dashboard': html=viewDashboard(); break;
    default: html=notFound();
  }
  app.innerHTML=shell(view,html);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const fn=ACTIONS[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el.dataset); }
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(!f.dataset||!f.dataset.form) return;
  e.preventDefault();
  const fn=FORMS[f.dataset.form];
  if(fn) fn(f);
});
document.addEventListener('pointermove',e=>{
  const a=document.getElementById('auth'); if(!a) return;
  const x=e.clientX/innerWidth-.5, y=e.clientY/innerHeight-.5;
  a.style.transform=`rotateY(${(x*16).toFixed(2)}deg) rotateX(${(-y*12).toFixed(2)}deg)`;
});
addEventListener('hashchange',()=>{ render(); scrollTo(0,0); });

load();
render();
</script>
