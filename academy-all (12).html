lign:left;vertical-align:top}\nth{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}\n.steps{counter-reset:s;list-style:none;padding:0}\n.steps li{counter-increment:s;position:relative;padding:12px 14px 12px 52px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:rgba(255,255,255,.02)}\n.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}\n@media (max-width:760px){.layers,.grid2{grid-template-columns:1fr}h1{font-size:26px}.card{padding:20px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<div class=\"eyebrow\">Описание · защита документа · подробно<\/div>\n<h1>Защита паспорта: подробное описание<\/h1>\n<p class=\"lead\">Современный электронный паспорт защищён на трёх уровнях: печатью, электронным чипом и средствами проверки. Подделка требует одновременного воспроизведения всех уровней, поэтому проверка на каждом из них даёт отдельный признак подлинности.<\/p>\n\n<div class=\"layers\">\n  <div class=\"layer\"><div class=\"n\">УРОВЕНЬ 1<\/div><b>Печать<\/b><p>Офсетная основа, высокая и глубокая печать. Сетки, микротекст, совмещение, скрытые изображения, антикопирование.<\/p><\/div>\n  <div class=\"layer\"><div class=\"n\">УРОВЕНЬ 2<\/div><b>Электронный чип<\/b><p>Бесконтактный чип с антенной, данные владельца и биометрия. Четыре логических механизма доступа.<\/p><\/div>\n  <div class=\"layer\"><div class=\"n\">УРОВЕНЬ 3<\/div><b>Проверка<\/b><p>Считыватели, компараторы и средства обнаружения чипа. Сверка документа с предъявителем.<\/p><\/div>\n<\/div>\n\n<nav class=\"toc\">\n  <a href=\"#history\">1. История и стандарты<\/a>\n  <a href=\"#print\">2. Печатная защита<\/a>\n  <a href=\"#process\">3. Процесс печати<\/a>\n  <a href=\"#chip\">4. Электронный чип<\/a>\n  <a href=\"#access\">5. Механизмы доступа<\/a>\n  <a href=\"#forgery\">6. Подделки<\/a>\n  <a href=\"#iin\">7. ИИН и пол<\/a>\n  <a href=\"#tools\">8. Средства проверки<\/a>\n  <a href=\"#check\">9. Порядок проверки<\/a>\n  <a href=\"#glossary\">10. Глоссарий<\/a>\n<\/nav>\n\n<section class=\"card\" id=\"history\">\n  <h2>1. История и стандарты<\/h2>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>Год<\/th><th>Событие<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>1980<\/td><td>ICAO публикует стандарты машиносчитываемых проездных документов — «ICAO Документ 9303».<\/td><\/tr>\n      <tr><td>1997<\/td><td>ICAO начинает работу по стандартизации электронных машиносчитываемых проездных документов (еМСПД).<\/td><\/tr>\n      <tr><td>1998, март<\/td><td>Малайзия становится первой страной, выдавшей биометрические (электронные) паспорта.<\/td><\/tr>\n      <tr><td>2002, декабрь<\/td><td>В чип Малайзии добавлены два изображения отпечатков пальцев (сначала в чип записывалось только изображение лица).<\/td><\/tr>\n      <tr><td>2004<\/td><td>Разработан символ еМСПД. Опубликованы спецификации защиты данных в чипе и структура данных для глобальной совместимости.<\/td><\/tr>\n      <tr><td>2010, 2 февраля<\/td><td>Малайзия начинает выдавать электронные паспорта по стандартам ICAO.<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <div class=\"note\">В первых малайзийских паспортах в чип также записывались сведения о последних 10 случаях пересечения границы. Этот пример показывает, что состав данных в чипе не фиксирован и определяется стандартом.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"print\">\n  <h2>2. Печатная защита<\/h2>\n  <p>Печать — важный аспект производства паспортов. Она даёт высокий уровень защиты, который трудно или практически невозможно подделать, изменить или повторно использовать. Безопасность создаётся сочетанием характеристик краски на странице (внешний вид, консистенция, текстура, качество) и самого печатного рисунка.<\/p>\n\n  <details open>\n    <summary>Защитная сетка <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Первый слой печати на защищённой поверхности, фоновый. Может состоять из нескольких элементов: линейного рисунка из одноцветных или разноцветных линий и гильошных композиций.<\/p>\n      <h3>Гильош<\/h3>\n      <p>Сложный геометрический узор из многократно повторяющихся тонких непрерывных замкнутых линий, построенный по математическим правилам. Образует розетки, рамки, бордюры и виньетки, может быть негативным или позитивным.<\/p>\n      <h3>Позитивная и негативная печать<\/h3>\n      <ul>\n        <li><b>Позитивная<\/b> — элемент напечатан краской, текст или рисунок видны цветом краски.<\/li>\n        <li><b>Негативная<\/b> — поверхность запечатана, а элемент остаётся незапечатанным.<\/li>\n      <\/ul>\n    <\/div>\n  <\/details>\n\n  <details>\n    <summary>Микротекст <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Один из самых распространённых средств графической защиты в документах. Размер знаков менее 0,4 мм, обычно 0,2–0,4 мм. Выполняется преимущественно металлографией и офсетной печатью.<\/p>\n      <p>В содержание обычно включают название страны, название документа и (или) аббревиатуры и цифры.<\/p>\n    <\/div>\n  <\/details>\n\n  <details>\n    <summary>Микропечать <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Состоит из микроизображений: цифр, символов и текстов. Может быть позитивной или негативной. Назначение — предотвращение воспроизведения документа: при копировании мелкие элементы теряют читаемость.<\/p>\n    <\/div>\n  <\/details>\n\n  <details>\n    <summary>Совмещение печати <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Изображение, часть которого напечатана на лицевой стороне листа, а часть на оборотной. Элементы одной стороны дополняют элементы другой без накладок и пробелов. Цельный сюжет виден только в проходящем свете.<\/p>\n      <p>Условия качественной печати: обе стороны печатаются одновременно и при одинаковых условиях окружающей среды; рисунок одного цвета точно совпадает с линиями другого цвета. Иначе снижаются защитная ценность и эстетика.<\/p>\n    <\/div>\n  <\/details>\n\n  <details>\n    <summary>Скрытое изображение <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Слово или эмблема внутри блока тонкой тёмной линии глубокой печати. Линии слова или эмблемы печатаются под прямым углом (90°) к остальным линиям блока.<\/p>\n      <ul>\n        <li>При нормальном освещении на расстоянии вытянутой руки скрытое изображение не видно: линии расположены так близко, что выглядят сплошной краской.<\/li>\n        <li>Когда документ наклонён к свету, линии одного направления создают тень, а линии противоположного направления пропускают свет. Тень формирует тёмный фон, и изображение проявляется.<\/li>\n        <li>В зависимости от направления взгляда оно выглядит светлым на тёмном фоне или тёмным на светлом.<\/li>\n      <\/ul>\n      <div class=\"note\">На подлинных документах скрытые изображения печатаются только глубокой печатью (интаглио). Копия, выполненная другим способом, не даст такого эффекта.<\/div>\n    <\/div>\n  <\/details>\n\n  <details>\n    <summary>Антикопировальная защита <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Изображения или узоры из регулярных параллельных многовекторных наборов линий или растровых элементов. Изменение направления, ширины и разделения линий позволяет создавать мелкие элементы, которые искажаются в цифровых копиях и при коммерческой печати.<\/p>\n      <p>Отдельный приём — изображение из тонких линий, которое становится видимым только при копировании. Это позволяет отличить копию от оригинала.<\/p>\n    <\/div>\n  <\/details>\n<\/section>\n\n<section class=\"card\" id=\"process\">\n  <h2>3. Процесс печати<\/h2>\n  <p>Печать — не одно событие, а серия процессов, которые объединяются в итоговый дизайн. Порядок на защищённом документе обычно такой:<\/p>\n  <div class=\"grid2\">\n    <div class=\"box\"><h3>Офсетная печать<\/h3><p>Первичная печать. Тонкие линии фона, основа документа.<\/p><\/div>\n    <div class=\"box\"><h3>Высокая печать<\/h3><p>Надпечатка поверх фоновой печати.<\/p><\/div>\n    <div class=\"box\"><h3>Глубокая печать (интаглио)<\/h3><p>Густая рельефная краска, тонкие линии, скрытые изображения.<\/p><\/div>\n    <div class=\"box\"><h3>Металлография<\/h3><p>Используется для микротекста вместе с офсетом.<\/p><\/div>\n  <\/div>\n  <div class=\"note warn\">В исходной презентации на слайде 17 надпечатка указана как высокая печать, а на слайде 18 — как глубокая. Уточните этот момент по методическому пособию.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"chip\">\n  <h2>4. Электронный чип<\/h2>\n  <p>В еМСПД внесена микросхема (чип), которую можно сравнить с небольшим компьютером для обработки и хранения данных. Чип с антенной крепится к носителю — полимерному или бумажному материалу.<\/p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h3>Как работает<\/h3>\n      <ul>\n        <li>Собственного источника питания нет: энергия поступает от считывателя.<\/li>\n        <li>Передача энергии и данных идёт через индуктивную связь — обмен через общее магнитное поле.<\/li>\n        <li>Работает на расстоянии до 10 см от считывателя.<\/li>\n        <li>Интерфейс — бесконтактный, по стандарту ISO 14443.<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"box\">\n      <h3>Где размещается<\/h3>\n      <ul>\n        <li>Вставка с чипом может быть встроена в титульный лист.<\/li>\n        <li>Может быть встроена в страницу с данными владельца.<\/li>\n        <li>Вставка размещается под защитным слоем и ламинатом, рядом с антенной.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n  <h3>Организация данных<\/h3>\n  <p>Данные в чипе расположены по стандарту и разбиты на группы данных (DG). Это обеспечивает глобальную совместимость: документ одной страны может быть прочитан на границе другой и автоматически проверен. Группы включают, в частности:<\/p>\n  <ul>\n    <li>данные радужной оболочки глаз;<\/li>\n    <li>дополнительные личные данные;<\/li>\n    <li>дополнительные сведения о документе;<\/li>\n    <li>информацию о ключе активной аутентификации;<\/li>\n    <li>группу для лиц, которых необходимо уведомить;<\/li>\n    <li>зарезервированные группы для будущего использования.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"card\" id=\"access\">\n  <h2>5. Механизмы защиты доступа<\/h2>\n  <p>Защита чипа состоит из четырёх логических механизмов. Каждый решает свою задачу, и вместе они не дают читать, подменять или копировать данные.<\/p>\n\n  <details open>\n    <summary>BAC — основной контроль доступа <span class=\"tag chip\">чип<\/span><\/summary>\n    <div class=\"body\">\n      <p>Считыватель не может обратиться к чипу, пока не знает ключ. Ключ BAC состоит из 24 символов и формируется из данных страницы:<\/p>\n      <div class=\"code\">номер документа + дата рождения + срок действия документа = 24 символа<\/div>\n      <p>Без этих данных чип не отвечает. Поэтому BAC защищает от считывания документа без физического доступа к странице с данными.<\/p>\n    <\/div>\n  <\/details>\n\n  <details>\n    <summary>PA — пассивная аутентификация <span class=\"tag chip\">чип<\/span><\/summary>\n    <div class=\"body\">\n      <p>Данные, хранящиеся в чипе, заверены электронной подписью. Считыватель проверяет подпись с помощью цифровых сертификатов. Так подтверждается, что данные не менялись после выдачи документа.<\/p>\n      <p><b>Что PA не доказывает:<\/b> подлинность самого чипа. Подписанные данные могут быть скопированы на другой чип. Для этого нужна следующая проверка.<\/p>\n    <\/div>\n  <\/details>\n\n  <details>\n    <summary>AA — активная аутентификация <span class=\"tag chip\">чип<\/span><\/summary>\n    <div class=\"body\">\n      <p>Проверяется, является ли чип подлинным и не используется ли копия. Это закрывает пробел PA: копия подписанных данных без закрытого ключа чипа не пройдёт AA.<\/p>\n    <\/div>\n  <\/details>\n\n  <details>\n    <summary>EAC — расширенный контроль доступа <span class=\"tag chip\">чип<\/span><\/summary>\n    <div class=\"body\">\n      <p>Защищает вторичные биометрические данные — изображения отпечатков пальцев и радужной оболочки глаза. Они доступны только при расширенном контроле доступа, то есть не каждому считывателю.<\/p>\n    <\/div>\n  <\/details>\n\n  <h3>Порядок взаимодействия<\/h3>\n  <p class=\"muted\" style=\"color:var(--muted)\">В общем виде: BAC открывает доступ к чипу → PA подтверждает подпись данных → AA подтверждает подлинность чипа → EAC открывает биометрию, если считыватель имеет на это право.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"forgery\">\n  <h2>6. Типичные подделки и признаки<\/h2>\n  <details open>\n    <summary>Чип не знают или не используют <span class=\"tag check\">признак<\/span><\/summary>\n    <div class=\"body\">\n      <p>Данные в чипе остаются подлинными, но визуальные данные на странице заменены. Признак: несоответствие фото или данных страницы и данных чипа при чтении.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>Чип портят <span class=\"tag check\">признак<\/span><\/summary>\n    <div class=\"body\">\n      <p>Информационная система не распознаёт чип. Признак: в месте расположения чипа есть пустое или повреждённое пространство; документ не считывается.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>Удаляют логотип электронного паспорта <span class=\"tag check\">признак<\/span><\/summary>\n    <div class=\"body\">\n      <p>Попытка стереть знак еМСПД с обложки. Признак: повреждение или отсутствие обязательного знака.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>Полностью поддельный документ с поддельным чипом <span class=\"tag check\">признак<\/span><\/summary>\n    <div class=\"body\">\n      <p>Поддельный чип не проходит криптографические проверки: PA не подтверждает подпись, AA не подтверждает подлинность чипа. Признак: ошибки на уровне PA или AA.<\/p>\n    <\/div>\n  <\/details>\n<\/section>\n\n<section class=\"card\" id=\"iin\">\n  <h2>7. ИИН и соответствие полу<\/h2>\n  <p>В материалах курса приводится правило: седьмая цифра индивидуального идентификационного номера (ИИН) указывает пол владельца — <b>3 у мужчин, 4 у женщин<\/b>. Проверка этого соответствия помогает выявить подмену данных.<\/p>\n  <div class=\"note warn\">В примере на слайде 27 ИИН записан как «950315 9 04734». Седьмая цифра в этом примере равна 9, а не 3 или 4, как указано в правиле. Это может быть опечатка в презентации. Перед занятием сверьте пример с первоисточником.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"tools\">\n  <h2>8. Средства проверки<\/h2>\n  <p>Документ проверяют с помощью считывателей, видеоспектральных компараторов и средств обнаружения чипа. В материалах курса упоминаются:<\/p>\n  <div class=\"grid2\">\n    <div class=\"box\"><h3>Считыватели и компараторы<\/h3><ul><li>Regula 7024<\/li><li>Regula 4305 — видеоспектральный компаратор<\/li><li>Regula 8880<\/li><\/ul><\/div>\n    <div class=\"box\"><h3>Обнаружение и чтение чипа<\/h3><ul><li>Doculus<\/li><li>Lumus<\/li><li>Q-Gate<\/li><li>АСПК — комплекс пограничного контроля<\/li><li>Считывание через мобильное приложение<\/li><\/ul><\/div>\n  <\/div>\n  <h3>Что показывает Regula 4305 по материалам курса<\/h3>\n  <ul>\n    <li>считывание информации с чипа;<\/li>\n    <li>считывание машиносчитываемой зоны;<\/li>\n    <li>скрытую закодированную персональную информацию.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"card\" id=\"check\">\n  <h2>9. Порядок проверки документа<\/h2>\n  <ol class=\"steps\">\n    <li><b>Визуальный осмотр.<\/b> Печать, сетка, микротекст, совмещение, скрытое изображение (при наклоне к свету), наличие знака еМСПД.<\/li>\n    <li><b>Машиносчитываемая зона.<\/b> Сверка данных страницы с базой.<\/li>\n    <li><b>Доступ к чипу (BAC).<\/b> Ключ из номера документа, даты рождения и срока действия.<\/li>\n    <li><b>Пассивная аутентификация (PA).<\/b> Проверка электронной подписи данных.<\/li>\n    <li><b>Активная аутентификация (AA).<\/b> Подтверждение подлинности чипа.<\/li>\n    <li><b>Биометрия (EAC).<\/b> Доступ к отпечаткам и радужке, если считыватель уполномочен.<\/li>\n    <li><b>Сверка с владельцем.<\/b> Фото и данные чипа против предъявителя.<\/li>\n    <li><b>Решение.<\/b> При несовпадении или подозрении — углублённая проверка.<\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"card\" id=\"glossary\">\n  <h2>10. Глоссарий<\/h2>\n  <div class=\"tbl\"><table>\n    <thead><tr><th>Термин<\/th><th>Значение<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>ICAO<\/td><td>Международная организация гражданской авиации; издаёт стандарты документов.<\/td><\/tr>\n      <tr><td>еМСПД<\/td><td>Электронный машиносчитываемый проездной документ.<\/td><\/tr>\n      <tr><td>DG<\/td><td>Группа данных (Data Group) в структуре чипа.<\/td><\/tr>\n      <tr><td>ISO 14443<\/td><td>Стандарт бесконтактного интерфейса чипа.<\/td><\/tr>\n      <tr><td>BAC / PA / AA / EAC<\/td><td>Механизмы защиты доступа к чипу (см. раздел 5).<\/td><\/tr>\n      <tr><td>Интаглио<\/td><td>Глубокая печать: рельефная краска и тонкие линии.<\/td><\/tr>\n      <tr><td>Гильош<\/td><td>Узор из повторяющихся тонких замкнутых линий по математическим правилам.<\/td><\/tr>\n      <tr><td>Микротекст<\/td><td>Знаки размером менее 0,4 мм.<\/td><\/tr>\n      <tr><td>Индуктивная связь<\/td><td>Передача энергии и данных через общее магнитное поле.<\/td><\/tr>\n      <tr><td>ИИН<\/td><td>Индивидуальный идентификационный номер.<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n<\/section>\n\n<section class=\"card\">\n  <h2>Источники и ограничения<\/h2>\n  <p>Описание составлено по двум презентациям курса: «Электронные машиносчитываемые проездные документы и биометрия» (39 слайдов) и «Характеристики печати и защитные свойства печати» (29 слайдов, редакция 06.2009). Элементы защиты, которых в этих материалах нет (например, голограммы или ультрафиолетовая защита), здесь не рассматриваются. Перед использованием в службе сверяйте сведения с действующими нормативными документами.<\/p>\n<\/section>\n\n<\/div>\n<\/body>\n<\/html>\n"}, {"id": "f2", "type": "frame", "title": "Защита паспорта: краткое описание", "html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Защита паспорта · описание<\/title>\n<style>\n:root{--bg:#0b1020;--card:#131b33;--line:#24305a;--ink:#eef2ff;--muted:#9aa8cf;--accent:#6d8dff;--accent2:#a46bff;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--grad:linear-gradient(135deg,#6d8dff,#a46bff);--font:\"Inter\",system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:radial-gradient(ellipse at top,#18244d 0%,var(--bg) 60%);color:var(--ink);font:15px/1.7 var(--font);min-height:100vh}\n.wrap{max-width:980px;margin:auto;padding:40px 22px 70px}\n.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}\nh1{font-size:34px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 12px}\nh2{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}\nh3{font-size:16px;margin:18px 0 8px}\np{margin:0 0 12px}\nul{margin:0 0 12px;padding-left:22px}\nli{margin:5px 0}\n.lead{color:var(--muted);font-size:17px;max-width:760px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-top:20px;box-shadow:0 10px 40px -14px rgba(0,0,0,.5)}\n.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}\n.layer{border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(255,255,255,.03);position:relative;overflow:hidden}\n.layer::before{content:\"\";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}\n.layer .n{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}\n.layer b{display:block;font-size:17px;margin:6px 0 6px}\n.layer p{color:#c9d3f0;font-size:14px;margin:0}\n.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}\n.toc a{color:var(--ink);text-decoration:none;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.03)}\n.toc a:hover{border-color:var(--accent)}\ndetails{border:1px solid var(--line);border-radius:14px;background:rgba(5,10,26,.35);margin-top:10px;overflow:hidden}\nsummary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}\nsummary::-webkit-details-marker{display:none}\nsummary::after{content:\"▾\";color:var(--muted);transition:.2s}\ndetails[open] summary::after{transform:rotate(180deg)}\n.body{padding:0 18px 16px;color:#d6defa}\n.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:6px}\n.tag.chip{color:var(--accent);border-color:rgba(109,141,255,.5)}\n.tag.print{color:var(--accent2);border-color:rgba(164,107,255,.5)}\n.tag.check{color:var(--ok);border-color:rgba(52,211,153,.5)}\n.note{border-left:3px solid var(--accent);background:rgba(109,141,255,.08);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0;color:#dbe3ff}\n.warn{border-left-color:var(--warn);background:rgba(251,191,36,.08)}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.box{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:rgba(255,255,255,.02)}\n.box h3{margin-top:0}\n.code{font-family:Consolas,\"Courier New\",monospace;background:rgba(5,10,26,.6);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:#cfe0ff;overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}\nth{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}\n@media (max-width:760px){.layers,.grid2{grid-template-columns:1fr}h1{font-size:26px}.card{padding:20px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<div class=\"eyebrow\">Описание · защита документа<\/div>\n<h1>Защита паспорта: как устроена и как проверяется<\/h1>\n<p class=\"lead\">Современный паспорт защищён сразу на трёх уровнях: печатью, электронным чипом и средствами проверки на границе. Подделку трудно сделать, потому что её нужно повторить на каждом уровне одновременно.<\/p>\n\n<div class=\"layers\">\n  <div class=\"layer\">\n    <div class=\"n\">УРОВЕНЬ 1<\/div>\n    <b>Печать<\/b>\n    <p>Сетки, микротекст, совмещённые сюжеты, скрытые изображения и антикопировальные узоры.<\/p>\n  <\/div>\n  <div class=\"layer\">\n    <div class=\"n\">УРОВЕНЬ 2<\/div>\n    <b>Электронный чип<\/b>\n    <p>Бесконтактный чип с данными владельца и биометрией, защищённый криптографическими механизмами.<\/p>\n  <\/div>\n  <div class=\"layer\">\n    <div class=\"n\">УРОВЕНЬ 3<\/div>\n    <b>Проверка<\/b>\n    <p>Считыватели и средства обнаружения чипа, которые проверяют документ и сверяют его с владельцем.<\/p>\n  <\/div>\n<\/div>\n\n<nav class=\"toc\">\n  <a href=\"#print\">1. Печатная защита<\/a>\n  <a href=\"#chip\">2. Электронный чип<\/a>\n  <a href=\"#access\">3. Механизмы доступа<\/a>\n  <a href=\"#forgery\">4. Признаки подделки<\/a>\n  <a href=\"#tools\">5. Средства проверки<\/a>\n  <a href=\"#check\">6. Порядок проверки<\/a>\n<\/nav>\n\n<section class=\"card\" id=\"print\">\n  <h2>1. Печатная защита<\/h2>\n  <p>Печать — основа визуальной защиты. Документ трудно подделать, изменить или повторно использовать, потому что защитные свойства создаются сочетанием краски на странице и самого печатного рисунка. Элементы печатаются в несколько проходов: сначала офсетом, затем высокой и глубокой печатью.<\/p>\n  <details open>\n    <summary>Защитная сетка и гильош <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Первый слой печати, фоновый. Состоит из линий и гильошных композиций — сложных узоров из повторяющихся тонких замкнутых линий, построенных по математическим правилам. Такой узор трудно воспроизвести без специального оборудования.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>Микротекст и микропечать <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p><b>Микротекст<\/b> — знаки размером менее 0,4 мм, обычно 0,2–0,4 мм. В него включают название страны, документа и аббревиатуры. <b>Микропечать<\/b> — микроизображения из цифр, символов и текста, которые предотвращают воспроизведение документа.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>Совмещённое изображение <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Сюжет печатается частями на лицевой и оборотной сторонах листа. Элементы должны совпадать без накладок и пробелов, цельный сюжет виден только в проходящем свете. Подделка такого сюжета требует точного совмещения обеих сторон.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>Скрытое изображение <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Слово или эмблема внутри блока тонких линий глубокой печати. Линии скрытого изображения расположены под прямым углом (90°) к остальным. При нормальном освещении изображение не видно, а при наклоне документа к свету оно проявляется. На подлинных документах такие изображения печатаются только глубокой печатью.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>Антикопировальная защита <span class=\"tag print\">печать<\/span><\/summary>\n    <div class=\"body\">\n      <p>Узоры из регулярных параллельных линий или растровых элементов искажаются в цифровых копиях и при коммерческой печати. Изображение из тонких линий становится видимым только при копировании, что позволяет отличить копию от оригинала.<\/p>\n    <\/div>\n  <\/details>\n<\/section>\n\n<section class=\"card\" id=\"chip\">\n  <h2>2. Электронный чип<\/h2>\n  <p>В электронном машиносчитываемом проездном документе (еМСПД) встроен бесконтактный чип с антенной. Он хранит данные о документе и биометрические данные владельца. Стандарты разработаны ICAO (Документ 9303), а бесконтактный интерфейс соответствует ISO 14443.<\/p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h3>Как работает чип<\/h3>\n      <ul>\n        <li>Собственного источника питания нет: энергия поступает от считывателя через индуктивную связь.<\/li>\n        <li>Передача данных возможна на расстоянии до 10 см от считывателя.<\/li>\n        <li>Чип может быть встроен в титульный лист или в страницу с данными.<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"box\">\n      <h3>Как организованы данные<\/h3>\n      <ul>\n        <li>Данные разбиты на группы DG (Data Groups) по стандарту ICAO.<\/li>\n        <li>Единая структура обеспечивает совместимость: документ одной страны может быть прочитан на границе другой.<\/li>\n        <li>Стандартизация также позволяет автоматизировать проверку.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n  <div class=\"note\">Первые электронные паспорта (Малайзия, 1998) содержали изображение лица; отпечатки пальцев были добавлены позже. Современный стандарт предусматривает и биометрические данные, и механизмы защиты их от копирования.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"access\">\n  <h2>3. Механизмы защиты доступа к чипу<\/h2>\n  <p>Защита чипа состоит из нескольких логических механизмов. Каждый решает свою задачу.<\/p>\n  <details open>\n    <summary>BAC — основной контроль доступа <span class=\"tag chip\">чип<\/span><\/summary>\n    <div class=\"body\">\n      <p>Считыватель получает доступ к чипу, только если знает ключ из данных машиносчитываемой зоны: номер документа, дата рождения и срок действия. Ключ состоит из 24 символов. Без них чип не отвечает на запросы.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>PA — пассивная аутентификация <span class=\"tag chip\">чип<\/span><\/summary>\n    <div class=\"body\">\n      <p>Данные, хранящиеся в чипе, заверены электронной подписью. Проверка выполняется с помощью цифровых сертификатов. Так подтверждается, что данные не были изменены после выдачи документа.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>AA — активная аутентификация <span class=\"tag chip\">чип<\/span><\/summary>\n    <div class=\"body\">\n      <p>Проверяется, является ли чип подлинным и не используется ли его копия. Чип доказывает владение закрытым ключом, который нельзя скопировать.<\/p>\n    <\/div>\n  <\/details>\n  <details>\n    <summary>EAC — расширенный контроль доступа <span class=\"tag chip\">чип<\/span><\/summary>\n    <div class=\"body\">\n      <p>Защищает вторичные биометрические данные: изображения отпечатков пальцев и радужной оболочки глаза. Доступ к ним получают только уполномоченные считыватели.<\/p>\n    <\/div>\n  <\/details>\n<\/section>\n\n<section class=\"card\" id=\"forgery\">\n  <h2>4. Типичные способы подделки и признаки<\/h2>\n  <p>Чаще всего подделку выявляют по нарушению одного из уровней защиты.<\/p>\n  <table>\n    <thead><tr><th>Способ подделки<\/th><th>Признак<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>Чип не используется или не замечается<\/td><td>Данные в чипе подлинные, но визуальные данные заменены. Несоответствие между чипом и страницей.<\/td><\/tr>\n      <tr><td>Чип повреждён<\/td><td>Информационная система не распознаёт чип. Пустое место под чип, которое должно быть заполнено.<\/td><\/tr>\n      <tr><td>Удалён логотип электронного паспорта<\/td><td>Отсутствие или повреждение обязательного знака на обложке.<\/td><\/tr>\n      <tr><td>Полностью поддельный документ с поддельным чипом<\/td><td>Ошибки в структуре данных, неверная подпись (PA), нарушение AA.<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n  <div class=\"note warn\">Одна из проверок — соответствие индивидуального номера (ИИН) полу владельца: по материалам курса, седьмая цифра ИИН равна 3 у мужчин и 4 у женщин.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"tools\">\n  <h2>5. Средства проверки<\/h2>\n  <p>Для проверки документа на границе применяются считыватели и средства обнаружения чипа. В материалах курса упоминаются:<\/p>\n  <ul>\n    <li><b>Regula 7024, Regula 4305, Regula 8880<\/b> — считыватели и видеоспектральные компараторы;<\/li>\n    <li><b>Doculus, Lumus<\/b> — средства обнаружения и чтения чипа;<\/li>\n    <li><b>Q-Gate, АСПК<\/b> — комплексы пограничного контроля;<\/li>\n    <li><b>Мобильное приложение<\/b> — считывание микросхемы через смартфон.<\/li>\n  <\/ul>\n  <p>С помощью видеоспектрального компаратора Regula 4305 проверяют защитные средства: считывают данные с чипа, машиносчитываемую зону и скрытую закодированную информацию.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"check\">\n  <h2>6. Порядок проверки документа<\/h2>\n  <ol>\n    <li><b>Визуальный осмотр.<\/b> Проверка печати, сетки, микротекста, совмещения и наличия знака электронного паспорта.<\/li>\n    <li><b>Считывание машиносчитываемой зоны.<\/b> Сверка данных страницы с базой.<\/li>\n    <li><b>Чтение чипа.<\/b> Установление доступа (BAC), проверка подписи (PA), подлинности чипа (AA), доступ к биометрии (EAC).<\/li>\n    <li><b>Сверка с владельцем.<\/b> Сравнение фото в документе и данных чипа с предъявителем.<\/li>\n    <li><b>Решение.<\/b> При несовпадении или подозрении — углублённая проверка и выяснение обстоятельств.<\/li>\n  <\/ol>\n  <div class=\"note\">Этот описательный материал составлен по двум презентациям курса (электронные документы и характеристики печати). Другие элементы защиты, которых нет в этих материалах, здесь не рассмотрены.<\/div>\n<\/section>\n\n<\/div>\n<\/body>\n<\/html>\n"},{"id": "f6", "type": "frame", "title": "3D-образец: где находятся защиты", "html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>Защиты паспорта в 3D<\/title>\n<style>\n/* Layout: 3D-стенд слева (книжка паспорта, вращение мышью), справа вкладки видов, режимы света и список защитных элементов. */\n:root{\n  --bg:#eef0ec; --surface:#fbfbf8; --text:#1b2320; --muted:#5b665f; --line:#d3d8d0;\n  --accent:#1f5f4a; --accent-soft:#dcebe3; --stage:#1a2226; --stage2:#27343a;\n  --ok:#2c7a4b; --ok-soft:#dff0e4; --typ:#8a6516; --typ-soft:#f5ebd2;\n  --font-body:\"Segoe UI\",\"Helvetica Neue\",Arial,sans-serif; --font-head:\"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#121715; --surface:#1b2220; --text:#e5eae6; --muted:#9aa7a0; --line:#2f3a36;\n  --accent:#7fd0ae; --accent-soft:#1f3a30; --stage:#0d1214; --stage2:#192226;\n  --ok:#7fd49a; --ok-soft:#1d3526; --typ:#e2bd6c; --typ-soft:#3a3016; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#121715; --surface:#1b2220; --text:#e5eae6; --muted:#9aa7a0; --line:#2f3a36;\n  --accent:#7fd0ae; --accent-soft:#1f3a30; --stage:#0d1214; --stage2:#192226;\n  --ok:#7fd49a; --ok-soft:#1d3526; --typ:#e2bd6c; --typ-soft:#3a3016; color-scheme:dark}\n*{box-sizing:border-box}\nbody{position:relative;margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font-body);padding-inline:16px;padding-block:16px 40px}\n.page{max-width:1280px;margin:0 auto}\nh1{font:700 26px/1.2 var(--font-head);margin:4px 0 6px;text-wrap:balance}\n.lead{margin:0 0 16px;color:var(--muted);max-width:70ch}\n.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}\n@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}\n.left{position:sticky;top:12px;min-width:0}\n@media (max-width:980px){.left{position:static}}\n.stage{position:relative;aspect-ratio:16/10;background:radial-gradient(120% 90% at 50% 20%,var(--stage2),var(--stage));border-radius:14px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}\n@media (max-width:640px){.stage{aspect-ratio:4/3.6}}\n.stage.drag{cursor:grabbing}\n.scene{position:absolute;inset:0;perspective:2200px}\n.rig{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}\n.stage.drag .rig{transition:none}\n.book{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.1,.2,1)}\n.f{position:absolute;width:1250px;height:880px;top:-440px;transform-style:preserve-3d}\n.f canvas{position:absolute;inset:0;width:1250px;height:880px;display:block;backface-visibility:hidden}\n.f.r{left:0}.f.l{left:-1250px}\n.layer{background:#e9e7df;border:1px solid #c9c6ba;border-radius:0 8px 8px 0}\n.layer.lft{border-radius:8px 0 0 8px}\n.pivot{position:absolute;left:0;top:-440px;width:0;height:880px;transform-style:preserve-3d;transform-origin:0 50%;transition:transform 1.1s cubic-bezier(.45,.05,.2,1)}\n.cvf{position:absolute;left:0;top:0;width:1250px;height:880px;backface-visibility:hidden;transform-style:preserve-3d}\n.cvf.back{transform:rotateY(180deg)}\n.cvf canvas{border-radius:0 10px 10px 0}\n.cvf.back canvas{border-radius:10px 0 0 10px}\n.m-uv .cv{filter:brightness(.32) saturate(.5)}\n.m-ir .cv{filter:grayscale(1) brightness(.75) contrast(1.1)}\n.m-tr .cv{filter:brightness(1.12)}\n.holo{position:absolute;left:1000px;top:110px;width:215px;height:230px;border-radius:14px;overflow:hidden;\n  background:linear-gradient(135deg,#e8edf2,#9aa6b2 40%,#e3e9ee 60%,#8a97a4);box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 6px rgba(0,0,0,.25);backface-visibility:hidden;transition:opacity .4s}\n.holo i{position:absolute;inset:0;background-image:linear-gradient(var(--ang,115deg),#6ff 0%,#f6f 22%,#ff6 45%,#6f9 68%,#69f 90%);background-size:300% 300%;background-position:var(--bx,50%) var(--by,50%);\n  -webkit-mask-image:var(--mask);mask-image:var(--mask);-webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:normal}\n.m-uv .holo{opacity:.12}.m-ir .holo{opacity:.25;filter:grayscale(1)}.m-tr .holo{opacity:.55}\n.hs{position:absolute;width:calc(var(--hs,60)*1px);height:calc(var(--hs,60)*1px);margin:calc(var(--hs,60)*-.5px) 0 0 calc(var(--hs,60)*-.5px);border-radius:50%;border:calc(var(--hs,60)*.07px) solid #fff;background:rgba(31,95,74,.92);color:#fff;\n  font:700 calc(var(--hs,60)*.5px)/1 var(--font-head);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 0 0 calc(var(--hs,60)*.08px) rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.45);backface-visibility:hidden;transition:transform .2s,background .2s}\n.hs:hover{transform:scale(1.18)}\n.hs.on{background:#e0a425;color:#1b1b1b;transform:scale(1.28)}\n.hs[hidden]{display:none}\n.book.closed .f.l{display:none}\n.hs.typ{background:rgba(120,88,20,.95)}\n.hs.on.typ{background:#e0a425}\n.hs:focus-visible{outline:3px solid #fff;outline-offset:3px}\n.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:3}\n.tools button,.chip{font:600 13px var(--font-body);border:1px solid rgba(255,255,255,.22);background:rgba(10,15,17,.6);color:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;backdrop-filter:blur(4px)}\n.tools button:hover{background:rgba(31,95,74,.9)}\n.hint{position:absolute;left:12px;top:12px;z-index:3;font:12px var(--font-body);color:#cdd6d1;background:rgba(10,15,17,.55);padding:6px 10px;border-radius:8px;max-width:55%}\n.card{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;background:var(--surface);color:var(--text);border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-height:62%;overflow:auto;font-size:14px}\n.card[hidden]{display:none}\n.card h3{margin:0 0 4px;font:700 16px/1.3 var(--font-head);padding-right:28px}\n.card dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}\n.card dt{color:var(--muted);font-weight:600}.card dd{margin:0}\n.card .x{position:absolute;right:8px;top:8px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px 8px}\n.tag{display:inline-block;font:700 11px var(--font-body);letter-spacing:.03em;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}\n.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.typ{background:var(--typ-soft);color:var(--typ)}\n.panel{min-width:0;display:flex;flex-direction:column;gap:14px}\n.seg{display:flex;flex-wrap:wrap;gap:6px}\n.seg button{flex:1 1 auto;font:600 14px var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 12px;cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);border-color:var(--accent);color:#fff}\n:root[data-theme=\"dark\"] .seg button[aria-pressed=\"true\"]{color:#10201a}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .seg button[aria-pressed=\"true\"]{color:#10201a}}\n.seg button:focus-visible,.list button:focus-visible,.tools button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.lbl{font:700 11px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}\n.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}\n.list button{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}\n.list button:hover{border-color:var(--accent)}\n.list button[aria-current=\"true\"]{border-color:var(--accent);background:var(--accent-soft)}\n.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font:700 13px/26px var(--font-head);text-align:center}\n:root[data-theme=\"dark\"] .num{color:#10201a}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .num{color:#10201a}}\n.num.typ{background:var(--typ)}\n.list small{display:block;color:var(--muted);font-size:12.5px}\n.note{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}\n.note b{color:var(--text)}\n.dev{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;font-size:14px}\n.dev h2{font:700 17px var(--font-head);margin:0 0 8px}\n.dev table{width:100%;border-collapse:collapse;font-size:13.5px}\n.dev th,.dev td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}\n.dev th{background:var(--accent-soft)}\n.tw{overflow-x:auto}\n.theme{position:absolute;right:16px;top:16px;z-index:9}\n.theme button{font:600 12px var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}\n@media (max-width:640px){.hint{display:none}.theme{position:static;margin-top:12px}}\n@media (prefers-reduced-motion:reduce){.rig,.book,.pivot{transition:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<div class=\"theme\"><button id=\"themeBtn\">Тёмная / светлая<\/button><\/div>\n<h1>Где находятся защиты паспорта<\/h1>\n<p class=\"lead\">Учебный 3D-образец паспорта-книжки. Вращайте его мышью или пальцем, переключайте вид и режим света: обычный, ультрафиолет, инфракрасный и «на просвет». Нажмите на цифру на образце или на пункт в списке, чтобы увидеть, где защита расположена и чем её проверять.<\/p>\n<div class=\"grid\">\n  <div class=\"left\">\n    <div class=\"stage\" id=\"stage\">\n      <div class=\"hint\" id=\"hint\">Тяните: вращение. Колесо мыши: масштаб.<\/div>\n      <div class=\"tools\"><button id=\"zin\" aria-label=\"Приблизить\">＋<\/button><button id=\"zout\" aria-label=\"Отдалить\">－<\/button><button id=\"rst\">Сброс<\/button><button id=\"lab\" aria-pressed=\"true\">Метки<\/button><\/div>\n      <div class=\"scene\" id=\"scene\"><div class=\"rig\" id=\"rig\"><div class=\"book\" id=\"book\">\n        <div class=\"f r layer\" style=\"transform:translateZ(-26px)\"><\/div>\n        <div class=\"f r\" style=\"transform:translateZ(-26px)\"><canvas id=\"cBack\" width=\"1250\" height=\"880\" class=\"cv\" style=\"transform:rotateY(180deg)\"><\/canvas><\/div>\n        <div class=\"f r layer\" style=\"transform:translateZ(-20px)\"><\/div>\n        <div class=\"f r layer\" style=\"transform:translateZ(-15px)\"><\/div>\n        <div class=\"f r layer\" style=\"transform:translateZ(-10px)\"><\/div>\n        <div class=\"f r layer\" style=\"transform:translateZ(-5px)\"><\/div>\n        <div class=\"f l layer lft\" style=\"transform:translateZ(-20px)\"><\/div>\n        <div class=\"f l layer lft\" style=\"transform:translateZ(-14px)\"><\/div>\n        <div class=\"f l layer lft\" style=\"transform:translateZ(-8px)\"><\/div>\n        <div class=\"f l\" id=\"fL\" style=\"transform:translateZ(-1px)\"><canvas id=\"cVL\" width=\"1250\" height=\"880\"><\/canvas><div class=\"hsl\"><\/div><\/div>\n        <div class=\"f r\" id=\"fR\" style=\"transform:translateZ(0)\">\n          <canvas id=\"cData\" width=\"1250\" height=\"880\"><\/canvas>\n          <canvas id=\"cVR\" width=\"1250\" height=\"880\" style=\"display:none\"><\/canvas>\n          <div class=\"holo\" id=\"holo\"><i id=\"holoI\"><\/i><\/div>\n          <div class=\"hsr\"><\/div>\n        <\/div>\n        <div class=\"pivot\" id=\"pivot\" style=\"transform:translateZ(12px)\">\n          <div class=\"cvf\" id=\"cvFront\"><canvas id=\"cCov\" class=\"cv\" width=\"1250\" height=\"880\"><\/canvas><div class=\"hsc\"><\/div><\/div>\n          <div class=\"cvf back\"><canvas id=\"cIn\" class=\"cv\" width=\"1250\" height=\"880\"><\/canvas><\/div>\n        <\/div>\n      <\/div><\/div><\/div>\n      <div class=\"card\" id=\"card\" hidden><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"panel\">\n    <div><p class=\"lbl\">Вид<\/p>\n      <div class=\"seg\" id=\"views\">\n        <button data-v=\"cover\" aria-pressed=\"true\">Обложка<\/button>\n        <button data-v=\"data\" aria-pressed=\"false\">Страница данных<\/button>\n        <button data-v=\"pages\" aria-pressed=\"false\">Внутренние страницы<\/button>\n      <\/div><\/div>\n    <div><p class=\"lbl\">Свет<\/p>\n      <div class=\"seg\" id=\"modes\">\n        <button data-m=\"n\" aria-pressed=\"true\">Обычный<\/button>\n        <button data-m=\"uv\" aria-pressed=\"false\">УФ<\/button>\n        <button data-m=\"ir\" aria-pressed=\"false\">ИК<\/button>\n        <button data-m=\"tr\" aria-pressed=\"false\">На просвет<\/button>\n      <\/div><\/div>\n    <div><p class=\"lbl\" id=\"lcount\">Защитные элементы<\/p><ul class=\"list\" id=\"list\"><\/ul><\/div>\n    <div class=\"note\"><span class=\"tag ok\">ИСТОЧНИК<\/span> элемент подтверждён открытым источником. <span class=\"tag typ\">ТИПОВОЙ<\/span> элемент входит в стандартный набор защит книжных паспортов (ICAO Doc 9303); точное место и исполнение на конкретном образце сверяйте с описанием образца в приказе МВД РК № 533 от 30.06.2023 и с эталоном. Фото, имена, номера, эмблема и рисунок голограммы на образце условные.<\/div>\n  <\/div>\n<\/div>\n<section class=\"dev\">\n  <h2>Чем проверять (по материалам программы сборов)<\/h2>\n  <div class=\"tw\"><table>\n    <tr><th>Прибор<\/th><th>Что показывает<\/th><\/tr>\n    <tr><td>Лупа «Regula» (увеличение 10×) и лупа «Regula» 1010<\/td><td>Микропечать, признаки видов печати (ирисный раскат, металлография, рельефная печать), голограммы, ультрафиолетовые свойства материалов, ретрорефлективная защита.<\/td><\/tr>\n    <tr><td>Ультрафиолетовый осветитель «Regula» 2003<\/td><td>Оперативная проверка паспортов в УФ-свете: поглощение или флуоресценция материалов документа.<\/td><\/tr>\n    <tr><td>«Regula» 4005, 4103<\/td><td>Водяные знаки, филиграни, полосы и нити безопасности, цветные волокна, УФ-свойства, инфракрасная защита; переключение источников света.<\/td><\/tr>\n    <tr><td>Лупа спектральная люминесцентная «Regula» 4177<\/td><td>Детальная экспертиза паспортов и других документов со специальной защитой.<\/td><\/tr>\n    <tr><td>Считыватель «Regula» 7024<\/td><td>Полностраничные изображения в белом, инфракрасном и ультрафиолетовом свете, считывание данных и проверка элементов подлинности.<\/td><\/tr>\n    <tr><td>Компаратор видеоспектральный «Regula» 4305<\/td><td>Стационарная детальная экспертиза документов.<\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n<\/div>\n\n<script>\n(function(){\n'use strict';\nvar W=1250,H=880;\nvar $=function(s){return document.querySelector(s)};\nvar mode='n', view='cover', zoomMul=1, rx=-8, ry=0, sel=null, labelsOn=true;\n\n/* ---------- данные о защитных элементах ---------- */\nvar UV='Ультрафиолетовый осветитель «Regula» 2003, лупа 4177', LP='Лупа «Regula» 10×, лупа 1010', BIG='«Regula» 4005 / 4103';\nvar F=[\n {id:'c1',v:'cover',x:625,y:285,t:'Тиснение фольгой',where:'Лицевая сторона обложки: надписи и эмблема.',chk:'Рельеф ощущается пальцем, края чёткие, без наплывов клея и сколов. При наклоне фольга меняет блеск, а не остаётся матовой краской.',tool:'Визуально, на ощупь, лупа 10×.',src:0,m:'n'},\n {id:'c2',v:'cover',x:625,y:790,t:'Знак ePassport',where:'Нижняя часть лицевой стороны обложки.',chk:'Знак сообщает, что в документ встроен чип. Знак без чипа или чип без знака требует углублённой проверки. Данные чипа сверяют с визуальной зоной и фото с камеры.',tool:'Считыватель «Regula» 7024, проверка в системе пограничного контроля.',src:0,m:'n'},\n {id:'c3',v:'cover',x:180,y:640,t:'Материал и фактура обложки',where:'Вся поверхность обложки.',chk:'Однородный цвет и зерно материала, ровные углы, нет переклеенных участков и пузырей.',tool:'Визуально, на ощупь.',src:0,m:'n'},\n {id:'c4',v:'cover',x:22,y:440,t:'Переплёт по корешку',where:'Левый край обложки, место сгиба.',chk:'Нить прошивки целая и ровная, без следов вскрытия и повторной склейки. Проверяется при открытом документе.',tool:'Визуально, лупа 10×.',src:0,m:'n'},\n\n {id:'d1',v:'data',x:210,y:330,t:'Фото владельца',where:'Левая часть страницы данных.',chk:'Фото встроено в материал страницы, а не приклеено. Нет границ вклейки, фото не отслаивается; изображение совпадает с фото в чипе и с лицом предъявителя.',tool:'Визуально, лупа 10×, идентификация по шагам программы.',src:0,m:'n'},\n {id:'d2',v:'data',x:455,y:445,t:'Дополнительное («призрачное») фото',where:'Правее основного фото, в нижней части.',chk:'Уменьшенное бледное изображение того же лица. Должно совпадать с основным фото; отсутствие или другое лицо — признак подделки.',tool:'Визуально, лупа 10×.',src:0,m:'n'},\n {id:'d3',v:'data',x:1107,y:225,t:'HDM-элемент: металлизация высокого разрешения (барс)',where:'Вторая страница паспорта. Основа — голографическая плёнка.',chk:'Изображение барса хорошо видно без приборов. При наклоне меняются цвет и яркость переливов; контур чёткий.',tool:'Визуально при наклоне, лупа 10×.',src:1,m:'n'},\n {id:'d4',v:'data',x:1212,y:560,t:'Лазерная перфорация номера',where:'Правый край страницы данных, вертикально.',chk:'Номер выполнен мелкими сквозными отверстиями. На просвет точки светятся, на ощупь края шероховатые. Номер совпадает с печатным и с MRZ.',tool:'На просвет, лупа 10×.',src:0,m:'tr'},\n {id:'d5',v:'data',x:220,y:538,t:'Микротекст',where:'Тонкая линия под фото и в линиях рамок.',chk:'Под лупой линия распадается на повторяющиеся читаемые слова. У подделки — сплошная или рваная линия.',tool:'Лупа «Regula» 10× или 1010.',src:0,m:'n'},\n {id:'d6',v:'data',x:640,y:610,t:'Защитный фон и ирисный раскат',where:'Фон всей страницы данных; плавный переход цвета в полосах.',chk:'Тонкие линии гильоши без растра и пикселей, цвета переходят без ступенек. Копия даёт точечную структуру.',tool:'Лупа «Regula» 10×, «Regula» 4005.',src:0,m:'n'},\n {id:'d7',v:'data',x:905,y:545,t:'Рисунок, видимый в УФ',where:'Центральная нижняя часть страницы, между данными и MRZ.',chk:'В обычном свете не виден. В УФ-свете проявляется флуоресцентный рисунок, а бумага или пластик документа не светятся.',tool:UV+'.',src:0,m:'uv'},\n {id:'d8',v:'data',x:1160,y:765,t:'Машиносчитываемая зона (MRZ)',where:'Две нижние строки по 44 знака.',c
