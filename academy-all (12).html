  {"id": "c6", "title": "Учебные материалы: конспекты", "teacher": "Отделение подготовки контролёров", "color": "#fbbf24", "desc": "Конспекты занятий с проверкой знаний: программа сборов и характеристики печати.", "sections": [{"title": "Конспекты", "acts": [{"id": "f3", "type": "frame", "title": "Программа сборов: основы пограничного контроля", "html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Основы пограничного контроля · материал<\/title>\n<style>\n:root{--bg:#0b1020;--card:#131b33;--line:#24305a;--ink:#eef2ff;--muted:#9aa8cf;--accent:#6d8dff;--ok:#34d399;--bad:#fb7185;--grad:linear-gradient(135deg,#6d8dff,#a46bff);--font:\"Inter\",system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:radial-gradient(ellipse at top,#18244d 0%,var(--bg) 60%);color:var(--ink);font:15px/1.7 var(--font);min-height:100vh}\n.wrap{max-width:980px;margin:auto;padding:40px 22px 70px}\n.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}\nh1{font-size:30px;line-height:1.25;letter-spacing:-.02em;margin:8px 0 10px}\nh2{font-size:21px;margin:0 0 14px;letter-spacing:-.01em}\nh3{font-size:16px;margin:18px 0 8px}\np{margin:0 0 12px}\n.lead{color:var(--muted);font-size:16px;max-width:760px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-top:20px;box-shadow:0 10px 40px -14px rgba(0,0,0,.5)}\n.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}\n.toc a{color:var(--ink);text-decoration:none;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.03)}\n.toc a:hover{border-color:var(--accent)}\nul,ol{margin:0 0 12px;padding-left:22px}\nli{margin:4px 0}\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}\n.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px 16px}\n.stat b{display:block;font-size:26px;letter-spacing:-.02em}\n.stat span{color:var(--muted);font-size:13px}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}\nth{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}\ntd.n{text-align:center;white-space:nowrap}\n.tbl-wrap{overflow-x:auto}\n.note{border-left:3px solid var(--accent);background:rgba(109,141,255,.08);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0;color:#dbe3ff}\n.warn{border-left-color:#fbbf24;background:rgba(251,191,36,.08)}\n.q{padding:16px 0;border-top:1px solid var(--line)}\n.q:first-of-type{border-top:0;padding-top:0}\n.q .qt{font-weight:700;margin-bottom:8px}\n.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:6px;cursor:pointer;background:rgba(5,10,26,.4)}\n.opt input{accent-color:var(--accent)}\n.opt.right{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.1)}\n.opt.wrong{border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.1)}\n.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}\nbutton{font:inherit;font-weight:600;color:#fff;background:var(--grad);border:0;border-radius:12px;padding:10px 20px;cursor:pointer}\nbutton.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}\n.score{font-size:22px;font-weight:800}\n@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}h1{font-size:24px}.card{padding:20px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<div class=\"eyebrow\">Материал курса · Пограничный контроль<\/div>\n<h1>Программа сборов: основы пограничного контроля<\/h1>\n<p class=\"lead\">Материал составлен по программе сборов по специальной подготовке военнослужащих подразделений пограничного контроля ПС КНБ РК. Цель сборов — знакомство военнослужащих с особенностями несения службы в пунктах пропуска.<\/p>\n\n<div class=\"stats\">\n  <div class=\"stat\"><b>110<\/b><span>часов по каждой программе<\/span><\/div>\n  <div class=\"stat\"><b>4<\/b><span>учебные программы<\/span><\/div>\n  <div class=\"stat\"><b>15<\/b><span>тем в программе «Основы»<\/span><\/div>\n  <div class=\"stat\"><b>30 дн.<\/b><span>минимальный срок хранения записей<\/span><\/div>\n<\/div>\n\n<nav class=\"toc\">\n  <a href=\"#goal\">Цель и задачи<\/a>\n  <a href=\"#schedule\">Расписание<\/a>\n  <a href=\"#programs\">Программы<\/a>\n  <a href=\"#topics\">Темы «Основ»<\/a>\n  <a href=\"#docs\">Документы<\/a>\n  <a href=\"#video\">Видеорегистраторы<\/a>\n  <a href=\"#quiz\">Проверка знаний<\/a>\n<\/nav>\n\n<section class=\"card\" id=\"goal\">\n  <h2>1. Цель и задачи сборов<\/h2>\n  <p>Задача сборов — сформировать у военнослужащих представление о службе в подразделениях пограничного контроля и морально-психологическую готовность переносить интенсивные умственные и психологические нагрузки при охране Государственной границы в пунктах пропуска.<\/p>\n  <h3>По результатам сборов военнослужащий должен знать:<\/h3>\n  <ol>\n    <li>порядок пропуска через границу лиц, транспортных средств, грузов и товаров;<\/li>\n    <li>режим в пунктах пропуска через Государственную границу и порядок его поддержания;<\/li>\n    <li>виды пограничных нарядов и порядок их несения;<\/li>\n    <li>документы на право пересечения границы;<\/li>\n    <li>тактику действий нарушителей Государственной границы;<\/li>\n    <li>порядок работы с техническими средствами пограничного контроля.<\/li>\n  <\/ol>\n  <div class=\"note\">Подготовке к практическим занятиям должны предшествовать лекции и групповые занятия. Используйте презентации, образцы проездных документов и технические средства пограничного контроля.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"schedule\">\n  <h2>2. Расписание занятий<\/h2>\n  <ul>\n    <li><b>Понедельник–пятница:<\/b> 7 учебных часов в день.<\/li>\n    <li><b>Пятница:<\/b> 8-й учебный час отводится на рубежный контроль знаний. Он не входит в общее количество часов.<\/li>\n    <li><b>Суббота:<\/b> 4 учебных часа.<\/li>\n  <\/ul>\n  <p>Перед сборами оформляются приказ об организации, расписание занятий и план занятий. В ходе обучения проводится рубежный контроль: устный или письменный опрос, решение вводных задач, тестирование. Завершают сборы экзамен, который принимает комиссия, назначенная приказом начальника территориального подразделения.<\/p>\n  <div class=\"note warn\">Теория на экзамене оценивается по двум блокам: знание нормативных правовых актов, регулирующих службу, и знание порядка пограничного контроля лиц, транспортных средств, грузов и товаров.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"programs\">\n  <h2>3. Учебные программы<\/h2>\n  <div class=\"tbl-wrap\"><table>\n    <thead><tr><th>Программа<\/th><th class=\"n\">Всего часов<\/th><th class=\"n\">Занятия по расписанию<\/th><th class=\"n\">Лекции / груп.-прак.<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>Основы пограничного контроля<\/td><td class=\"n\">110<\/td><td class=\"n\">23<\/td><td class=\"n\">26 / 29<\/td><\/tr>\n      <tr><td>Проверка документов и лиц<\/td><td class=\"n\">110<\/td><td class=\"n\">12<\/td><td class=\"n\">—<\/td><\/tr>\n      <tr><td>Досмотр транспортных средств и грузов<\/td><td class=\"n\">110<\/td><td class=\"n\">24<\/td><td class=\"n\">—<\/td><\/tr>\n      <tr><td>Углубленная проверка документов<\/td><td class=\"n\">110<\/td><td class=\"n\">6<\/td><td class=\"n\">—<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n  <p class=\"muted\" style=\"color:var(--muted);font-size:13px;margin-top:10px\">Часть показателей взята из итоговых строк программ; точная разбивка по видам занятий приведена в исходном документе.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"topics\">\n  <h2>4. Темы программы «Основы пограничного контроля»<\/h2>\n  <ol>\n    <li>Основные положения Закона РК «О Государственной границе»: установление и обозначение границы, пограничный контроль в пунктах пропуска.<\/li>\n    <li>Режим в пунктах пропуска: въезд, выезд, пребывание и передвижение лиц и транспорта; ввоз и вывоз грузов; ответственность за нарушение режима.<\/li>\n    <li>Обязанности контролёра и младшего контролёра; пограничные наряды в пунктах пропуска, их виды и требования; стандарт поведения военнослужащего.<\/li>\n    <li>Действия пограничных нарядов при изменении обстановки и локализации конфликтной ситуации.<\/li>\n    <li>Технические средства пограничного контроля: характеристики и порядок применения.<\/li>\n    <li>Документы на право пересечения границы: составные части, реквизиты, документы граждан РК.<\/li>\n    <li>Порядок учёта, хранения, выдачи и использования портативных видеорегистраторов.<\/li>\n    <li>Меры безопасности при несении службы в автомобильном, железнодорожном, морском и авиационном пунктах пропуска.<\/li>\n    <li>Идентификация личности: правила сравнения фото в документе с предъявителем.<\/li>\n    <li>Порядок въезда и выезда граждан РК, иностранцев и лиц без гражданства; соглашения и международные договоры.<\/li>\n    <li>ЕИС «Беркут»: назначение, компоненты и возможности.<\/li>\n    <li>Конструктивные особенности транспортных средств в разных видах пунктов пропуска.<\/li>\n    <li>Основные виды наркотиков, способы сокрытия и провоза через границу.<\/li>\n    <li>Алгоритм действий контролёрского состава при выявлении лиц с признаками причастности к террористическим и экстремистским организациям.<\/li>\n    <li>Профайлинг и профиль риска: признаки поведения лиц, пытающихся нарушить границу.<\/li>\n  <\/ol>\n  <p>Каждая тема в документе имеет цели занятия (разъяснить, изучить, воспитать чувство личной ответственности за выполнение воинского долга), список учебных вопросов и наглядные средства: экран, маркерная доска и методические пособия.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"docs\">\n  <h2>5. Документы на право пересечения границы<\/h2>\n  <p>Документами, удостоверяющими личность, являются паспорт гражданина РК, удостоверение личности, вид на жительство иностранца, удостоверение лица без гражданства, дипломатический и служебный паспорта, удостоверение беженца, удостоверение личности моряка, заграничный паспорт, свидетельство на возвращение и свидетельство о рождении.<\/p>\n  <h3>Сроки действия, которые нужно знать<\/h3>\n  <ul>\n    <li><b>Паспорт гражданина РК<\/b> — 10 лет.<\/li>\n    <li><b>Удостоверение личности гражданина РК<\/b> — выдаётся с 16 лет, срок действия 10 лет.<\/li>\n    <li><b>Дипломатический и служебный паспорта РК<\/b> — 5 лет; выдаются должностным лицам по перечню, утверждённому Президентом РК.<\/li>\n    <li><b>Свидетельство на возвращение<\/b> — для однократного въезда в РК, не может использоваться для выезда; выдаётся загранучреждениями РК.<\/li>\n  <\/ul>\n  <h3>Элементы документа<\/h3>\n  <ul>\n    <li>данные владельца: Ф.И.О., место и дата рождения, фото, роспись;<\/li>\n    <li>служебные отметки: срок действия, разрешительные и ограничительные отметки;<\/li>\n    <li>подтверждение подлинности: подписи должностных лиц и оттиски печатей.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"card\" id=\"video\">\n  <h2>6. Портативные видеорегистраторы<\/h2>\n  <p>Видеорегистратор — устройство в едином корпусе с тремя кнопками: включение и выключение устройства, запуск и остановка записи, фотосъёмка. Время непрерывной работы — до 10 часов.<\/p>\n  <ul>\n    <li>Включённый видеорегистратор в режиме ожидания мигает зелёным индикатором раз в 3 секунды; запись при этом не ведётся.<\/li>\n    <li>После получения приказа на охрану границы военнослужащий включает видеорегистратор для ведения записи.<\/li>\n    <li>Записи сохраняются на встроенную карту памяти. Срок хранения записей на сервере — не менее 30 дней.<\/li>\n    <li>Доступ к архиву записей определяется приказом; на всех регистраторах устанавливается единый пароль, который не разглашается.<\/li>\n    <li>Для первого использования аккумулятор заряжают от сети 220 В. Рекомендуется раз в 3 месяца полностью разряжать его и заряжать до 100%.<\/li>\n  <\/ul>\n  <div class=\"note\">Правильное использование видеорегистратора должно обеспечивать полную и ясную фиксацию действий пограничного наряда и лица, пересекающего границу.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"quiz\">\n  <h2>7. Проверка знаний<\/h2>\n  <p class=\"muted\" style=\"color:var(--muted)\">Вопросы составлены по разделам выше. Выберите ответы и нажмите «Проверить».<\/p>\n  <div id=\"quizBox\"><\/div>\n  <div class=\"row\"><button id=\"check\">Проверить<\/button><button class=\"ghost\" id=\"reset\">Пройти заново<\/button><span class=\"score\" id=\"score\"><\/span><\/div>\n<\/section>\n\n<\/div>\n\n<script>\nconst QUESTIONS=[\n  {q:'Срок действия паспорта гражданина Республики Казахстан:',o:['5 лет','10 лет','15 лет','бессрочно'],a:1},\n  {q:'С какого возраста выдаётся удостоверение личности гражданина РК:',o:['с 14 лет','с 16 лет','с 18 лет','с рождения'],a:1},\n  {q:'Срок действия дипломатического паспорта РК:',o:['3 года','5 лет','10 лет','1 год'],a:1},\n  {q:'Минимальный срок хранения записей видеорегистратора на сервере:',o:['7 дней','14 дней','30 дней','90 дней'],a:2},\n  {q:'Свидетельство на возвращение используется:',o:['для многократного въезда','для однократного въезда в РК, но не для выезда','только для выезда из РК','вместо загранпаспорта за рубежом'],a:1},\n  {q:'Сколько часов составляет программа «Основы пограничного контроля»:',o:['72','90','110','120'],a:2},\n  {q:'8-й учебный час в пятницу:',o:['входит в общее количество часов','используется для рубежного контроля и не входит в общее количество часов','отводится на самоподготовку','не предусмотрен'],a:1},\n  {q:'Сколько учебных часов в субботу:',o:['2','4','7','8'],a:1}\n];\nconst box=document.getElementById('quizBox');\nbox.innerHTML=QUESTIONS.map((x,i)=>`<div class=\"q\" data-i=\"${i}\"><div class=\"qt\">${i+1}. ${x.q}<\/div>${x.o.map((o,j)=>`<label class=\"opt\"><input type=\"radio\" name=\"q${i}\" value=\"${j}\"><span>${o}<\/span><\/label>`).join('')}<\/div>`).join('');\ndocument.getElementById('check').onclick=()=>{\n  let ok=0;\n  QUESTIONS.forEach((x,i)=>{\n    const sel=document.querySelector(`input[name=\"q${i}\"]:checked`);\n    const labels=document.querySelectorAll(`input[name=\"q${i}\"]`);\n    labels.forEach((inp,j)=>{\n      const lab=inp.parentElement;\n      lab.classList.remove('right','wrong');\n      if(j===x.a) lab.classList.add('right');\n      else if(sel&&+sel.value===j) lab.classList.add('wrong');\n    });\n    if(sel&&+sel.value===x.a) ok++;\n  });\n  document.getElementById('score').textContent=`Верно: ${ok} из ${QUESTIONS.length}`;\n};\ndocument.getElementById('reset').onclick=()=>{\n  document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);\n  document.querySelectorAll('.opt').forEach(l=>l.classList.remove('right','wrong'));\n  document.getElementById('score').textContent='';\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "f4", "type": "frame", "title": "Характеристики печати и защитные свойства", "html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Характеристики печати · материал<\/title>\n<style>\n:root{--bg:#0b1020;--card:#131b33;--line:#24305a;--ink:#eef2ff;--muted:#9aa8cf;--accent:#6d8dff;--ok:#34d399;--bad:#fb7185;--grad:linear-gradient(135deg,#6d8dff,#a46bff);--font:\"Inter\",system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:radial-gradient(ellipse at top,#18244d 0%,var(--bg) 60%);color:var(--ink);font:15px/1.7 var(--font);min-height:100vh}\n.wrap{max-width:980px;margin:auto;padding:40px 22px 70px}\n.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}\nh1{font-size:30px;line-height:1.25;letter-spacing:-.02em;margin:8px 0 10px}\nh2{font-size:21px;margin:0 0 14px;letter-spacing:-.01em}\nh3{font-size:16px;margin:18px 0 8px}\np{margin:0 0 12px}\n.lead{color:var(--muted);font-size:16px;max-width:760px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-top:20px;box-shadow:0 10px 40px -14px rgba(0,0,0,.5)}\n.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}\n.toc a{color:var(--ink);text-decoration:none;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.03)}\n.toc a:hover{border-color:var(--accent)}\nul,ol{margin:0 0 12px;padding-left:22px}\nli{margin:4px 0}\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}\n.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px 16px}\n.stat b{display:block;font-size:26px;letter-spacing:-.02em}\n.stat span{color:var(--muted);font-size:13px}\n.note{border-left:3px solid var(--accent);background:rgba(109,141,255,.08);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0;color:#dbe3ff}\n.warn{border-left-color:#fbbf24;background:rgba(251,191,36,.08)}\n.term{display:grid;grid-template-columns:200px 1fr;gap:10px 18px;margin:10px 0}\n.term dt{font-weight:700;color:#fff}\n.term dd{margin:0;color:#dbe3ff}\n.q{padding:16px 0;border-top:1px solid var(--line)}\n.q:first-of-type{border-top:0;padding-top:0}\n.q .qt{font-weight:700;margin-bottom:8px}\n.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:6px;cursor:pointer;background:rgba(5,10,26,.4)}\n.opt input{accent-color:var(--accent)}\n.opt.right{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.1)}\n.opt.wrong{border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.1)}\n.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}\nbutton{font:inherit;font-weight:600;color:#fff;background:var(--grad);border:0;border-radius:12px;padding:10px 20px;cursor:pointer}\nbutton.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}\n.score{font-size:22px;font-weight:800}\n@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}h1{font-size:24px}.card{padding:20px}.term{grid-template-columns:1fr}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<div class=\"eyebrow\">Материал курса · Защитные свойства документов<\/div>\n<h1>Характеристики печати и защитные свойства печати<\/h1>\n<p class=\"lead\">Конспект занятия по презентации (29 слайдов, редакция 06.2009). Цель занятия — ознакомить слушателей с характеристиками печати и её защитными свойствами.<\/p>\n\n<div class=\"stats\">\n  <div class=\"stat\"><b>3<\/b><span>основных способа печати<\/span><\/div>\n  <div class=\"stat\"><b>0,2–0,4 мм<\/b><span>размер знаков микротекста<\/span><\/div>\n  <div class=\"stat\"><b>90°<\/b><span>угол линий скрытого изображения<\/span><\/div>\n  <div class=\"stat\"><b>9<\/b><span>вопросов в проверке знаний<\/span><\/div>\n<\/div>\n\n<nav class=\"toc\">\n  <a href=\"#role\">1. Роль печати<\/a>\n  <a href=\"#char\">2. Характеристики<\/a>\n  <a href=\"#reg\">3. Совмещение<\/a>\n  <a href=\"#multi\">4. Многоэтапность<\/a>\n  <a href=\"#guil\">5. Защитная сетка<\/a>\n  <a href=\"#micro\">6. Микропечать<\/a>\n  <a href=\"#anti\">7. Антикопирование<\/a>\n  <a href=\"#hidden\">8. Скрытое изображение<\/a>\n  <a href=\"#quiz\">9. Проверка знаний<\/a>\n<\/nav>\n\n<section class=\"card\" id=\"role\">\n  <h2>1. Роль печати в защите документа<\/h2>\n  <p>Печать — важный аспект производства паспортов. Она обеспечивает высокий уровень защиты, который трудно или практически невозможно подделать, изменить или повторно использовать. Безопасность документа создаётся сочетанием характеристик краски на странице и напечатанного текста.<\/p>\n  <div class=\"note\">В начале занятия проводится проверка знаний по способам печати: высокая, офсетная и глубокая печать. Слайды 4–12 содержат только названия способов и служат для опроса слушателей.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"char\">\n  <h2>2. Характеристики печати<\/h2>\n  <p>Характеристики печати относятся к внешнему виду, консистенции, текстуре и качеству красок на подложке. Они определяются способом печати и являются важным фактором при изучении защитных свойств документа.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"reg\">\n  <h2>3. Совмещение печати<\/h2>\n  <p>Совмещённое изображение печатается частями на лицевой и оборотной сторонах листа. Элементы одной стороны дополняют элементы другой без накладок и пробелов. Цельный сюжет виден только в проходящем свете.<\/p>\n  <h3>Условия качественного совмещения<\/h3>\n  <ul>\n    <li>обе стороны бумаги печатаются одновременно и при одинаковых условиях окружающей среды;<\/li>\n    <li>рисунок одного цвета должен точно совпадать с линиями другого цвета; иначе снижаются защитная ценность и эстетика печати.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"card\" id=\"multi\">\n  <h2>4. Печать как последовательность процессов<\/h2>\n  <p>Печать — не одно событие, а серия процессов, которые складываются в итоговый дизайн. Первичная печать на защищённом документе обычно выполняется офсетным способом, а остальные процессы наносятся поверх неё.<\/p>\n  <dl class=\"term\">\n    <dt>Офсетная печать<\/dt><dd>основа документа, в том числе тонкие линии фона.<\/dd>\n    <dt>Высокая печать<\/dt><dd>надпечатка поверх фоновой печати.<\/dd>\n    <dt>Глубокая печать (интаглио)<\/dt><dd>густая рельефная краска, тонкие линии, скрытые изображения.<\/dd>\n  <\/dl>\n  <div class=\"note warn\">В исходной презентации на слайде 17 надпечатка указана как высокая печать, а на слайде 18 — как глубокая. Уточните этот момент по методическому пособию перед занятием.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"guil\">\n  <h2>5. Защитная сетка и гильош<\/h2>\n  <p>Первый слой печати на печатной поверхности называется <b>защитной сеткой<\/b> (фоновым слоем). Она может состоять из нескольких элементов: линейного рисунка из одноцветных или разноцветных линий и гильошных композиций.<\/p>\n  <dl class=\"term\">\n    <dt>Гильош<\/dt><dd>графический элемент — сложный геометрический узор из многократно повторяющихся тонких непрерывных замкнутых линий, построенный по математическим правилам. Образует розетки, рамки, бордюры и виньетки.<\/dd>\n    <dt>Позитивная печать<\/dt><dd>элемент напечатан краской, то есть текст или рисунок видны цветом краски.<\/dd>\n    <dt>Негативная печать<\/dt><dd>поверхность запечатана, а элемент остаётся незапечатанным.<\/dd>\n  <\/dl>\n<\/section>\n\n<section class=\"card\" id=\"micro\">\n  <h2>6. Микропечать и микротекст<\/h2>\n  <p><b>Микротекст<\/b> — один из самых распространённых средств графической защиты. Размер знаков менее 0,4 мм, обычно 0,2–0,4 мм. Выполняется преимущественно металлографией и офсетной печатью. В содержание обычно включают название страны, название документа, аббревиатуры и цифры.<\/p>\n  <p><b>Микропечать<\/b> состоит из микроизображений: цифр, символов и текстов. Она может быть позитивной или негативной и служит для предотвращения воспроизведения документа.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"anti\">\n  <h2>7. Антикопировальная защита<\/h2>\n  <p>Изображения или узоры строятся из регулярных параллельных многовекторных наборов линий или растровых элементов. Изменение направления и ширины линий позволяет создавать мелкие элементы, которые искажаются в цифровых копиях и при коммерческой печати.<\/p>\n  <div class=\"note\">Изображение из тонких линий становится видимым только при копировании. Это позволяет отличить копию от оригинала.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"hidden\">\n  <h2>8. Скрытое изображение<\/h2>\n  <p>Скрытое изображение — слово или эмблема внутри блока тонких тёмных линий глубокой печати. Линии слова или эмблемы печатаются под прямым углом (90°) к остальным линиям блока.<\/p>\n  <ul>\n    <li>при нормальном освещении на расстоянии вытянутой руки скрытое изображение не видно: линии расположены так близко, что выглядят сплошной краской;<\/li>\n    <li>когда документ наклонён к свету, линии одного направления создают тень, а линии противоположного направления пропускают свет; тень формирует тёмный фон, и изображение становится видимым;<\/li>\n    <li>в зависимости от направления взгляда оно выглядит светлым на тёмном фоне или тёмным на светлом.<\/li>\n  <\/ul>\n  <div class=\"note\">На подлинных документах скрытые изображения печатаются только глубокой печатью. Это одна из проверок подлинности.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"quiz\">\n  <h2>9. Проверка знаний<\/h2>\n  <p class=\"muted\" style=\"color:var(--muted)\">Выберите ответы и нажмите «Проверить».<\/p>\n  <div id=\"quizBox\"><\/div>\n  <div class=\"row\"><button id=\"check\">Проверить<\/button><button class=\"ghost\" id=\"reset\">Пройти заново<\/button><span class=\"score\" id=\"score\"><\/span><\/div>\n<\/section>\n\n<\/div>\n\n<script>\nconst QUESTIONS=[\n  {q:'Размер знаков микротекста:',o:['менее 0,4 мм (обычно 0,2–0,4 мм)','1 мм','2 мм','0,8 мм'],a:0},\n  {q:'Цельный (совмещённый) сюжет можно увидеть:',o:['при обычном освещении','только в проходящем свете','только под ультрафиолетом','только на копии'],a:1},\n  {q:'Скрытое изображение на подлинном документе печатается:',o:['офсетной печатью','высокой печатью','глубокой печатью (интаглио)','цифровой печатью'],a:2},\n  {q:'Линии скрытого изображения расположены по отношению к остальным линиям блока:',o:['параллельно','под углом 45°','под прямым углом (90°)','произвольно'],a:2},\n  {q:'Защитная сетка — это:',o:['последний слой печати','первый слой печати (фоновый)','голограмма','микротекст'],a:1},\n  {q:'Гильош — это:',o:['сплошная заливка цветом','повторяющиеся тонкие замкнутые линии по математическим правилам','фотография владельца','штрихкод'],a:1},\n  {q:'Антикопировальная защита проявляется тем, что изображение:',o:['исчезает при копировании','становится видимым при копировании','не меняется при копировании','копируется без искажений'],a:1},\n  {q:'Микропечать служит для:',o:['украшения документа','предотвращения воспроизведения документа','записи данных в чип','указания номера выпуска'],a:1},\n  {q:'Тонкие линии на заднем плане документа выполняются:',o:['глубокой печатью','высокой печатью','офсетной печатью','трафаретной печатью'],a:2}\n];\nconst box=document.getElementById('quizBox');\nbox.innerHTML=QUESTIONS.map((x,i)=>`<div class=\"q\"><div class=\"qt\">${i+1}. ${x.q}<\/div>${x.o.map((o,j)=>`<label class=\"opt\"><input type=\"radio\" name=\"q${i}\" value=\"${j}\"><span>${o}<\/span><\/label>`).join('')}<\/div>`).join('');\ndocument.getElementById('check').onclick=()=>{\n  let ok=0;\n  QUESTIONS.forEach((x,i)=>{\n    const sel=document.querySelector(`input[name=\"q${i}\"]:checked`);\n    document.querySelectorAll(`input[name=\"q${i}\"]`).forEach((inp,j)=>{\n      const lab=inp.parentElement;\n      lab.classList.remove('right','wrong');\n      if(j===x.a) lab.classList.add('right');\n      else if(sel&&+sel.value===j) lab.classList.add('wrong');\n    });\n    if(sel&&+sel.value===x.a) ok++;\n  });\n  document.getElementById('score').textContent=`Верно: ${ok} из ${QUESTIONS.length}`;\n};\ndocument.getElementById('reset').onclick=()=>{\n  document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);\n  document.querySelectorAll('.opt').forEach(l=>l.classList.remove('right','wrong'));\n  document.getElementById('score').textContent='';\n};\n<\/script>\n<\/body>\n<\/html>\n"}]}]},
  {"id": "c7", "title": "Тренажёр вопросов", "teacher": "Отделение подготовки контролёров", "color": "#fb7185", "desc": "Интерактивный тренажёр: тренировка, экзамен, ошибки и статистика.", "sections": [{"title": "Тренажёр", "acts": [{"id": "f5", "type": "frame", "title": "Тренажёр вопросов (интерактивно)", "html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Тренажёр вопросов<\/title>\n<style>\n:root{\n  --bg:#f6f7fb;--surface:#ffffff;--surface-2:#fafbfd;\n  --ink:#0b1220;--ink2:#2b3649;--muted:#6b7689;--faint:#9aa3b5;\n  --line:#e6e9f0;--line2:#d4dae5;\n  --accent:#4f46e5;--accent-ink:#4338ca;--accent-soft:#eef0ff;\n  --ok:#059669;--ok-soft:#ecfbf4;--ok-line:#bfead6;--ok-ink:#065f46;\n  --bad:#e11d48;--bad-soft:#fff1f3;--bad-line:#fecdd6;--bad-ink:#9f1239;\n  --warn:#b45309;--warn-soft:#fff9eb;--warn-line:#fbe3a6;--warn-ink:#8a5a00;\n  --r:16px;--r-sm:11px;\n  --shadow-sm:0 1px 2px rgba(11,18,32,.04);\n  --shadow:0 1px 2px rgba(11,18,32,.04),0 6px 20px -8px rgba(11,18,32,.08);\n  --shadow-lg:0 2px 4px rgba(11,18,32,.04),0 18px 40px -16px rgba(11,18,32,.18);\n  --grad:linear-gradient(135deg,#4f46e5,#7c3aed);\n  --font:\"Inter\",system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif;\n  color-scheme:light;\n}\n@media all{\n  :root{\n    --bg:#0a1430;--surface:#11203f;--surface-2:#0e1a36;\n    --ink:#ffffff;--ink2:#f1f5ff;--muted:#c3cfe6;--faint:#9fb0d0;\n    --line:#21345c;--line2:#2f4672;\n    --accent:#6d8dff;--accent-ink:#9db4ff;--accent-soft:#172a55;\n    --ok:#34d399;--ok-soft:#0d2a23;--ok-line:#1d5a48;--ok-ink:#6ee7b7;\n    --bad:#fb7185;--bad-soft:#2b1319;--bad-line:#6b2636;--bad-ink:#fda4af;\n    --warn:#fbbf24;--warn-soft:#2a2210;--warn-line:#5b4716;--warn-ink:#fcd34d;\n    --shadow-sm:0 1px 2px rgba(0,0,0,.4);\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);\n    --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 48px -18px rgba(0,0,0,.8);\n    color-scheme:dark;\n  }\n}\n#bgFx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}\nbutton,input,select{font:inherit;color:inherit}\nbutton{cursor:pointer;transition:background .2s,border-color .2s,color .2s,box-shadow .2s,transform .15s,opacity .2s}\nbutton:disabled{cursor:default;opacity:.4;transform:none!important}\nbutton:active:not(:disabled){transform:scale(.98)}\n:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:9px}\n[hidden]{display:none!important}\n.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}\n.muted{color:var(--muted);font-size:14px}\n\n/* ---------- Header ---------- */\n.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}\n.topbar-in{max-width:1240px;margin:auto;height:68px;padding:0 28px;display:flex;align-items:center;gap:24px}\n.brand{display:flex;align-items:center;gap:11px}\n.logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(79,70,229,.6)}\n.brand-name{font-weight:750;font-size:16px;letter-spacing:-.02em;line-height:1.1}\n.brand-sub{font-size:12px;color:var(--muted);font-weight:500}\n.seg-nav{display:flex;gap:2px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--line);overflow-x:auto}\n.seg-nav button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}\n.seg-nav button:hover{color:var(--ink)}\n.seg-nav button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}\n.spacer{flex:1}\n.ring-mini{display:flex;align-items:center;gap:12px}\n.ring-mini svg{display:block}\n.ring-mini .txt{font-size:13px;color:var(--muted);line-height:1.25}\n.ring-mini .txt b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}\n\n/* ---------- Layout ---------- */\n.wrap{max-width:1240px;margin:auto;padding:36px 28px 64px}\n.page-head{margin-bottom:24px}\n.page-head h1{margin:6px 0 4px;font-size:30px;font-weight:750;letter-spacing:-.03em;line-height:1.15}\n.page-head p{margin:0;color:var(--muted);font-size:15px;max-width:620px}\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}\n.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}\n.stat .top{display:flex;align-items:center;justify-content:space-between}\n.stat .icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}\n.stat .icon.ok{background:var(--ok-soft);color:var(--ok)}\n.stat .icon.warn{background:var(--warn-soft);color:var(--warn-ink)}\n.stat .icon.bad{background:var(--bad-soft);color:var(--bad)}\n.stat .v{font-size:28px;font-weight:750;letter-spacing:-.03em;margin-top:12px;font-variant-numeric:tabular-nums;line-height:1}\n.stat .l{font-size:13px;color:var(--muted);margin-top:6px;font-weight:500}\n.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}\n.meter i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}\n.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}\n.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:96px}\n.side .card{padding:18px 18px 20px}\n.side .eyebrow{display:block;margin-bottom:12px}\n\n/* ---------- Controls ---------- */\n.search{position:relative}\n.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}\n.search input,.select{width:100%;padding:11px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface-2);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}\n.search input{padding-left:40px}\n.search input::placeholder{color:var(--faint)}\n.search input:focus,.select:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}\n.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}\n.chips button{padding:9px 10px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2)}\n.chips button:hover:not(.active){border-color:var(--accent);color:var(--accent-ink)}\n.chips button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px -4px rgba(79,70,229,.6)}\n.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink2);margin-top:14px;cursor:pointer;user-select:none}\n.switch input{position:absolute;opacity:0;pointer-events:none}\n.switch .track{width:40px;height:23px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .2s}\n.switch .track::after{content:\"\";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1)}\n.switch input:checked + .track{background:var(--accent)}\n.switch input:checked + .track::after{transform:translateX(17px)}\n.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:3px}\n.linkbtn{margin-top:14px;width:100%;padding:9px;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--muted);font-size:13px;font-weight:600}\n.linkbtn:hover{color:var(--bad-ink);background:var(--bad-soft)}\n.map{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-height:240px;overflow:auto;padding:2px}\n.dot{aspect-ratio:1;border-radius:6px;border:0;background:var(--line);padding:0;min-width:0}\n.dot:hover{transform:scale(1.15)}\n.dot.st-bad{background:var(--bad-line)}\n.dot.st-mid{background:#c7d2fe}\n.dot.st-ok{background:#6ee7b7}\n.dot.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}\n.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}\n.keys-list{display:grid;gap:10px;font-size:13px;color:var(--ink2)}\n.keys-list div{display:flex;justify-content:space-between;align-items:center;gap:8px}\n.keys-list span{color:var(--muted);display:flex;gap:4px;align-items:center}\nkbd{font:600 11px/1 var(--font);background:var(--surface-2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:4px 6px;color:var(--ink2);min-width:22px;text-align:center}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid transparent;font-weight:650;font-size:14px;white-space:nowrap}\n.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(79,70,229,.75),inset 0 1px 0 rgba(255,255,255,.18)}\n.btn.primary:hover:not(:disabled){box-shadow:0 12px 24px -10px rgba(79,70,229,.85),inset 0 1px 0 rgba(255,255,255,.18);transform:translateY(-1px)}\n.btn.ghost{background:var(--surface);border-color:var(--line2);color:var(--ink2);box-shadow:var(--shadow-sm)}\n.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}\n.btn.sm{padding:8px 14px;font-size:13px}\n\n/* ---------- Question card ---------- */\n.qcard{padding:32px 36px 28px;overflow:hidden;position:relative}\n.qcard::before{content:\"\";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}\n.fade{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1)}\n@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}\n.tag.part{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}\n.tag.ok{background:var(--ok-soft);color:var(--ok-ink);border-color:var(--ok-line)}\n.tag.mid{color:var(--accent-ink)}\n.tag.bad{background:var(--bad-soft);color:var(--bad-ink);border-color:var(--bad-line)}\n.timer{font-variant-numeric:tabular-nums;font-weight:750;font-size:14px;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}\n.timer.low{background:var(--bad-soft);color:var(--bad-ink)}\n.counter{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}\n.bar-thin{height:4px;background:var(--line);border-radius:99px;margin:20px 0 28px;overflow:hidden}\n.bar-thin i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}\n.qt{font-size:22px;line-height:1.45;font-weight:650;letter-spacing:-.02em;margin:0 0 24px;color:var(--ink)}\n.opts{display:grid;gap:10px}\n.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:15px 18px;border:1px solid var(--line2);border-radius:14px;background:var(--surface);color:var(--ink2);box-shadow:var(--shadow-sm)}\n.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--accent) 45%,var(--line2));transform:translateY(-1px);box-shadow:var(--shadow)}\n.opt .k{width:32px;height:32px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);flex:none}\n.opt .t{flex:1;font-size:15px;line-height:1.5}\n.opt .mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}\n.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset,var(--shadow-sm)}\n.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}\n.opt.correct{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok-ink)}\n.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}\n.opt.correct .mark{background:var(--ok)}\n.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft);color:var(--bad-ink)}\n.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}\n.opt.wrong .mark{background:var(--bad)}\n.opt.dim{opacity:.55}\n.opt:disabled{cursor:default}\n.fb{margin-top:22px;padding:16px 18px;border-radius:14px;font-size:14px;border:1px solid;display:flex;gap:12px;align-items:flex-start;animation:fadeUp .3s ease}\n.fb .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}\n.fb.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink)}\n.fb.ok .ico{background:var(--ok);color:#fff}\n.fb.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad-ink)}\n.fb.bad .ico{background:var(--bad);color:#fff}\n.fb b{font-weight:700}\n.warn-note{margin-top:10px;font-size:13px;color:var(--warn-ink);background:var(--warn-soft);border:1px solid var(--warn-line);padding:11px 14px;border-radius:12px}\n.qfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}\n.qfoot .hint{font-size:13px;color:var(--muted)}\n.empty{padding:64px 24px;text-align:center;color:var(--muted)}\n.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}\n\n/* ---------- Exam setup & result ---------- */\n.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 14px}\n.formgrid label{display:grid;gap:8px}\n.select{padding:11px 12px;cursor:pointer}\n.result{padding:52px 36px;text-align:center}\n.ring{width:172px;height:172px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;box-shadow:var(--shadow)}\n.ring-in{width:140px;height:140px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}\n.ring-in b{font-size:36px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}\n.ring-in span{font-size:13px;color:var(--muted);margin-top:4px}\n.result h2{margin:0 0 6px;font-size:26px;font-weight:750;letter-spacing:-.03em}\n.result .sub{color:var(--muted);font-size:15px}\n.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}\n.wlist{text-align:left;margin:36px auto 0;max-width:840px}\n.wlist h3{font-size:15px;margin:0 0 4px;font-weight:700}\n.wi{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:10px;background:var(--surface-2)}\n.wi .q{font-weight:600;font-size:14px;color:var(--ink);margin-top:10px}\n.wi .a{color:var(--ok-ink);font-size:13px;margin-top:6px}\n.row-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}\n\n/* ---------- Stats ---------- */\n.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}\n.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}\n.panel-pad{padding:22px 24px}\n.chart{display:flex;align-items:flex-end;gap:14px;height:200px;margin-top:20px;padding-top:10px;border-bottom:1px solid var(--line)}\n.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}\n.chart .bar{width:100%;max-width:56px;border-radius:10px 10px 4px 4px;background:var(--grad);min-height:4px;transition:height .6s cubic-bezier(.2,.8,.2,1)}\n.chart .bar.empty{background:var(--line)}\n.chart .n{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}\n.chart .d{font-size:11px;color:var(--muted);white-space:nowrap}\n.dist{display:grid;gap:12px;margin-top:16px}\n.dist .row{display:grid;grid-template-columns:110px 1fr 40px;gap:12px;align-items:center;font-size:13px;color:var(--ink2)}\n.dist .track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}\n.dist .track i{display:block;height:100%;background:var(--grad);border-radius:99px}\n.dist .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}\n.note{margin-top:14px;font-size:12px;color:var(--faint)}\n.actions-col{display:grid;gap:10px;margin-top:16px}\n\n/* ---------- Toast ---------- */\n.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#0b1220;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:50}\n.toast.show{opacity:1;transform:translate(-50%,0)}\n.toast .ico{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center}\n\n.foot{max-width:1240px;margin:auto;padding:0 28px 36px;color:var(--faint);font-size:12px;text-align:center}\n\n/* ---------- Визуализация: шкала процесса ---------- */\n#viz{background:radial-gradient(ellipse at center,#0a1630 0%,#03060d 70%);color:#00f0ff;border-radius:var(--r);padding:24px 16px 28px;font-family:Consolas,\"Courier New\",monospace;border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-lg)}\n#viz .viz-stage{position:relative;width:100%;max-width:900px;height:260px;margin:0 auto;perspective:1200px}\n#viz .viz-holo{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .2s ease-out}\n#viz .viz-holo::before{content:\"\";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,240,255,.07) 0,rgba(0,240,255,.07) 1px,transparent 1px,transparent 4px);pointer-events:none;z-index:5;animation:viz-scan 8s linear infinite}\n#viz .viz-scale{position:absolute;left:50%;top:50%;width:86%;height:14px;transform:translate(-50%,-50%)}\n#viz .viz-track{position:absolute;inset:0;border:1px solid #00f0ff;border-radius:99px;background:rgba(0,240,255,.06);box-shadow:0 0 14px rgba(0,240,255,.35)}\n#viz .viz-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,#00f0ff,#ff2bd6,#39ff88,#ffb347,#c77dff);background-size:200% 100%;box-shadow:0 0 18px #00f0ff;animation:viz-shimmer 2s linear infinite}\n#viz .viz-fill::after{content:\"\";position:absolute;right:-2px;top:-8px;bottom:-8px;width:4px;border-radius:2px;background:#fff;box-shadow:0 0 14px #fff,0 0 28px #00f0ff}\n#viz .viz-sweep{position:absolute;top:-70px;bottom:-70px;width:70px;left:0;background:linear-gradient(90deg,transparent,rgba(0,240,255,.2),transparent);animation:viz-sweep 3.5s linear infinite;pointer-events:none;z-index:6}\n#viz .viz-node{position:absolute;top:50%;width:0;height:0;--c:#00f0ff}\n#viz .viz-dot{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:2px solid var(--c);background:#03060d;box-shadow:0 0 10px var(--c);transition:background .3s,box-shadow .3s}\n#viz .viz-node.on .viz-dot{background:var(--c);box-shadow:0 0 22px var(--c),0 0 40px var(--c)}\n#viz .viz-up{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:var(--c);text-shadow:0 0 8px var(--c)}\n#viz .viz-node.on .viz-up{text-shadow:0 0 14px var(--c),0 0 26px var(--c)}\n#viz .viz-down{position:absolute;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:11px;color:var(--c);opacity:.85}\n#viz .viz-st{display:inline-block;margin-top:5px;padding:1px 7px;border:1px solid var(--c);border-radius:3px;font-size:10px}\n#viz .viz-pl{display:flex;justify-content:space-between;font-size:12px;margin:8px auto 6px;max-width:900px;opacity:.8}\n#viz .viz-log{max-width:900px;margin:22px auto 0;height:110px;overflow:hidden;font-size:12px;line-height:1.6;border-left:2px solid #00f0ff;padding-left:12px;opacity:.85}\n#viz .viz-log div{animation:viz-login .4s ease-out}\n#viz .viz-ok{color:#39ff88}\n#viz .viz-fail{color:#ff4d6d}\n#viz .viz-info{color:#00f0ff}\n@keyframes viz-scan{to{background-position:0 40px}}\n@keyframes viz-shimmer{to{background-position:200% 0}}\n@keyframes viz-sweep{from{left:-70px}to{left:100%}}\n@keyframes viz-login{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}\n\n@media (max-width:1100px){\n  .grid{grid-template-columns:1fr}\n  .side{position:static;display:grid;grid-template-columns:1fr 1fr}\n  .side .card:first-child{grid-column:1/-1}\n  .two{grid-template-columns:1fr}\n}\n@media (max-width:720px){\n  .topbar-in{padding:0 14px;gap:10px}\n  .brand-sub,.ring-mini .txt,.brand div:not(.logo){display:none}\n  .seg-nav button{padding:7px 10px;font-size:13px}\n  .wrap{padding:24px 16px 48px}\n  .page-head h1{font-size:24px}\n  .stats,.kpis{grid-template-columns:repeat(2,1fr);gap:10px}\n  .stat{padding:14px}\n  .stat .v{font-size:23px}\n  .side{grid-template-columns:1fr}\n  .qcard{padding:24px 20px 22px}\n  .qt{font-size:18px}\n  .qfoot .hint{display:none}\n  .qfoot .btn{flex:1}\n  .formgrid{grid-template-columns:1fr}\n  .map{grid-template-columns:repeat(12,1fr)}\n}\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{animation:none!important;transition:none!important}\n}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"bgFx\" aria-hidden=\"true\"><\/canvas>\n\n<header class=\"topbar\">\n  <div class=\"topbar-in\">\n    <div class=\"brand\">\n      <div class=\"logo\" aria-hidden=\"true\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h11a4 4 0 0 1 4 4v10H8a4 4 0 0 1-4-4z\"/><path d=\"m9 11 2 2 4-4\"/><\/svg>\n      <\/div>\n      <div>\n        <div class=\"brand-name\">Тренажёр<\/div>\n        <div class=\"brand-sub\">Подготовка к тестированию<\/div>\n      <\/div>\n    <\/div>\n    <nav class=\"seg-nav\" aria-label=\"Разделы\">\n      <button class=\"active\" data-tab=\"train\">Тренировка<\/button>\n      <button data-tab=\"exam\">Экзамен<\/button>\n      <button data-tab=\"mistakes\">Ошибки<\/button>\n      <button data-tab=\"stats\">Статистика<\/button>\n      <button data-tab=\"viz\">Визуализация<\/button>\n    <\/nav>\n    <div class=\"spacer\"><\/div>\n    <div class=\"ring-mini\">\n      <svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" aria-hidden=\"true\">\n        <defs><linearGradient id=\"gr\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#4f46e5\"/><stop offset=\"1\" stop-color=\"#7c3aed\"/><\/linearGradient><\/defs>\n        <circle cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"4\"/>\n        <circle id=\"ringArc\" cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"url(#gr)\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"0 100\" transform=\"rotate(-90 20 20)\"/>\n      <\/svg>\n      <div class=\"txt\"><b id=\"topPct\">0%<\/b>выучено <span id=\"topCount\">0 / 0<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main class=\"wrap\">\n\n  <!-- Тренировка -->\n  <section id=\"train\">\n    <div class=\"page-head\">\n      <div class=\"eyebrow\">Режим тренировки<\/div>\n      <h1>Учим вопросы до автоматизма<\/h1>\n      <p>Ответ проверяется сразу. Верные ответы повторяются через растущие интервалы: 1, 3, 7, 14 и 30 дней. Ошибки возвращаются в тот же день.<\/p>\n    <\/div>\n\n    <div class=\"stats\">\n      <div class=\"stat\">\n        <div class=\"top\"><span class=\"eyebrow\">Всего<\/span><span class=\"icon\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01\"/><\/svg><\/span><\/div>\n        <div class=\"v\" id=\"sTotal\">0<\/div><div class=\"l\">вопросов в базе<\/div>\n      <\/div>\n      <div class=\"stat\">\n        <div class=\"top\"><span class=\"eyebrow\">Выучено<\/span><span class=\"icon ok\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5 9-10\"/><\/svg><\/span><\/div>\n        <div class=\"v\" id=\"sMastered\">0<\/div>\n        <div class=\"meter\"><i id=\"sBar\" style=\"width:0%\"><\/i><\/div>\n      <\/div>\n      <div class=\"stat\">\n        <div class=\"top\"><span class=\"eyebrow\">К повторению<\/span><span class=\"icon warn\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg><\/span><\/div>\n        <div class=\"v\" id=\"sDue\">0<\/div><div class=\"l\">сейчас в очереди<\/div>\n      <\/div>\n      <div class=\"stat\">\n        <div class=\"top\"><span class=\"eyebrow\">Ошибки<\/span><span class=\"icon bad\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6 6 18\"/><\/svg><\/span><\/div>\n        <div class=\"v\" id=\"sMist\">0<\/div><div class=\"l\">требуют разбора<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"grid\">\n      <article class=\"card qcard\" id=\"trainBox\"><\/article>\n      <aside class=\"side\">\n        <div class=\"card\">\n          <span class=\"eyebrow\">Поиск<\/span>\n          <div class=\"search\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/><\/svg>\n            <input type=\"search\" id=\"search\" placeholder=\"Текст вопроса или ответа\" aria-label=\"Поиск\">\n          <\/div>\n        <\/div>\n\n        <div class=\"card\">\n          <span class=\"eyebrow\">Фильтр<\/span>\n          <div class=\"chips\" id=\"chips\">\n            <button class=\"active\" data-f=\"all\">Все<\/button>\n            <button data-f=\"due\">К повторению<\/button>\n            <button data-f=\"left\">Не выучено<\/button>\n            <button data-f=\"mistakes\">Ошибки<\/button>\n            <button data-f=\"1\">Часть 1<\/button>\n            <button data-f=\"2\">Часть 2<\/button>\n          <\/div>\n          <select class=\"select\" id=\"block\" aria-label=\"Блок вопросов\"><\/select>\n          <label class=\"switch\"><span>Перемешивать вопросы<\/span><input type=\"checkbox\" id=\"shuffleQ\"><span class=\"track\"><\/span><\/label>\n          <label class=\"switch\"><span>Перемешивать варианты<\/span><input type=\"checkbox\" id=\"shuffleO\"><span class=\"track\"><\/span><\/label>\n          <button class=\"linkbtn\" id=\"resetTrain\">Сбросить прогресс тренировки<\/button>\n        <\/div>\n\n        <div class=\"card\">\n          <span class=\"eyebrow\">Карта вопросов<\/span>\n          <div class=\"map\" id=\"map\"><\/div>\n          <div class=\"legend\">\n            <span><i style=\"background:var(--line)\"><\/i>новый<\/span>\n            <span><i style=\"background:#c7d2fe\"><\/i>в процессе<\/span>\n            <span><i style=\"background:#6ee7b7\"><\/i>выучен<\/span>\n            <span><i style=\"background:var(--bad-line)\"><\/i>ошибка<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"card\">\n          <span class=\"eyebrow\">Клавиатура<\/span>\n          <div class=\"keys-list\">\n            <div>Выбрать ответ <span><kbd>1<\/kbd>–<kbd>4<\/kbd> <kbd>A<\/kbd>–<kbd>D<\/kbd><\/span><\/div>\n            <div>Далее <span><kbd>Enter<\/kbd> <kbd>→<\/kbd><\/span><\/div>\n            <div>Назад <span><kbd>←<\/kbd><\/span><\/div>\n          <\/div>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/section>\n\n  <!-- Экзамен -->\n  <section id=\"exam\" hidden>\n    <div class=\"page-head\">\n      <div class=\"eyebrow\">Проверка знаний<\/div>\n      <h1>Экзамен<\/h1>\n      <p>Имитация тестирования: ответы не проверяются до конца, работает таймер.<\/p>\n    <\/div>\n    <article class=\"card qcard\" id=\"examBox\"><\/article>\n  <\/section>\n\n  <!-- Ошибки -->\n  <section id=\"mistakes\" hidden>\n    <div class=\"page-head\">\n      <div class=\"eyebrow\">Журнал ошибок<\/div>\n      <h1>Ошибки<\/h1>\n      <p>Вопросы, на которые вы последний раз ответили неверно. Правильный ответ можно сразу повторить.<\/p>\n    <\/div>\n    <div class=\"card panel-pad\" id=\"mistBox\"><\/div>\n  <\/section>\n\n  <!-- Статистика -->\n  <section id=\"stats\" hidden>\n    <div class=\"page-head\">\n      <div class=\"eyebrow\">Аналитика<\/div>\n      <h1>Статистика<\/h1>\n      <p>Динамика ответов за неделю и распределение вопросов по этапам повторения.<\/p>\n    <\/div>\n    <div id=\"statBox\"><\/div>\n    <input type=\"file\" id=\"importFile\" accept=\"application/json\" hidden>\n  <\/section>\n\n  <!-- Визуализация -->\n  <section id=\"viz\" hidden>\n    <div class=\"page-head\">\n      <div class=\"eyebrow\">Наглядно<\/div>\n      <h1>Процесс тестирования<\/h1>\n      <p>Этапы пайплайна QA на шкале прогона. Наведите мышь на сцену, чтобы изменить ракурс.<\/p>\n    <\/div>\n    <div class=\"viz-stage\" id=\"vizStage\">\n      <div class=\"viz-holo\" id=\"vizHolo\">\n        <div class=\"viz-scale\" id=\"vizScale\">\n          <div class=\"viz-track\"><div class=\"viz-fill\" id=\"vizFill\"><\/div><\/div>\n          <div class=\"viz-sweep\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"viz-pl\"><span>ПРОГРЕСС ПРОГОНА<\/span><span id=\"vizPercent\">0%<\/span><\/div>\n    <div class=\"viz-log\" id=\"vizLog\"><\/div>\n  <\/section>\n<\/main>\n\n<div class=\"
